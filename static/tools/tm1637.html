<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Segmentos TM1637</title>
  <link rel="stylesheet" href="tools.css">
  <style>
    #display { width: min(100%, 560px); background: #111; border-radius: 12px; display: block; }
    #display .seg { cursor: pointer; }
    #display .seg:hover { stroke: #fff; stroke-width: 0.6; }
    .symbols button { font-family: monospace; min-width: 44px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Herramientas</a>
  <h1>🔢 Segmentos TM1637</h1>
  <p class="subtitle">Toca los segmentos para encenderlos y formar letras o símbolos que el bloque "mostrar texto" no tiene.</p>

  <div class="layout">
    <div style="flex:1 1 360px">
      <svg id="display" viewBox="-6 -6 116 46"></svg>
    </div>

    <div class="side">
      <div class="panel">
        <div class="row">
          <label class="field">Escribir texto
            <input type="text" id="text" maxlength="4" size="6" placeholder="HOLA">
          </label>
          <button id="write" style="align-self:flex-end">Poner</button>
          <label class="field">Nombre
            <input type="text" id="name" size="8" value="tm1637">
          </label>
        </div>
        <p class="hint" style="margin-top:6px">Letras, números, espacio, guion y * (grados). Después puedes retocar segmentos.</p>
      </div>

      <div class="panel">
        <p class="section-title">Símbolos para el dígito elegido (<span id="digitLabel">1</span>)</p>
        <div class="row symbols" id="symbols"></div>
        <div class="row" style="margin-top:8px">
          <button id="colon">: Dos puntos</button>
          <button id="clear">Limpiar</button>
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <button class="primary" id="insert" data-embedded-only>Insertar en mis bloques</button>
          <button id="copy">Copiar código</button>
        </div>
        <pre class="code" id="code" style="margin-top:10px"></pre>
      </div>
    </div>
  </div>

  <script src="tools.js"></script>
  <script>
    // Misma tabla que _SEGMENTS de tm1637.py: 0-9, a-z, espacio, guion, *.
    const SEGMENTS = [0x3f, 0x06, 0x5b, 0x4f, 0x66, 0x6d, 0x7d, 0x07, 0x7f, 0x6f, 0x77, 0x7c, 0x39, 0x5e,
      0x79, 0x71, 0x3d, 0x76, 0x06, 0x1e, 0x76, 0x38, 0x55, 0x54, 0x3f, 0x73, 0x67, 0x50, 0x6d, 0x78,
      0x3e, 0x1c, 0x2a, 0x76, 0x6e, 0x5b, 0x00, 0x40, 0x63];
    function encodeChar(ch) {
      const o = ch.charCodeAt(0);
      if (o === 32) return SEGMENTS[36];
      if (o === 42) return SEGMENTS[38];
      if (o === 45) return SEGMENTS[37];
      if (o >= 65 && o <= 90) return SEGMENTS[o - 55];
      if (o >= 97 && o <= 122) return SEGMENTS[o - 87];
      if (o >= 48 && o <= 57) return SEGMENTS[o - 48];
      return 0;
    }
    // Segmentos a..g de un dígito (x, y, ancho, alto), igual que la miniatura del bloque.
    const SHAPES = [[4, 0, 12, 3], [16, 3, 3, 13], [16, 18, 3, 13], [4, 31, 12, 3], [1, 18, 3, 13], [1, 3, 3, 13], [4, 15.5, 12, 3]];
    const SYMBOLS = [
      ["°", 0x63], ["C", 0x39], ["-", 0x40], ["_", 0x08], ["¯", 0x01], ["≡", 0x49],
      ["[", 0x39], ["]", 0x0f], ["U", 0x3e], ["n", 0x54], ["r", 0x50], ["o", 0x5c],
    ];

    const edit = Tools.editPayload();
    const nameEl = document.getElementById("name");
    let segs = [0, 0, 0, 0];
    let digit = 0;

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("display");
    function render() {
      svg.innerHTML = "";
      segs.forEach((b, d) => {
        const ox = d * 24 + (d >= 2 ? 8 : 0);
        const frame = document.createElementNS(NS, "rect");
        Object.entries({ x: ox - 2, y: -3, width: 24, height: 40, rx: 2, fill: "none",
          stroke: d === digit ? "#7b6cf6" : "none", "stroke-width": 0.8 }).forEach(([k, v]) => frame.setAttribute(k, v));
        svg.appendChild(frame);
        SHAPES.forEach(([x, y, w, h], s) => {
          const r = document.createElementNS(NS, "rect");
          Object.entries({ x: ox + x, y, width: w, height: h, rx: 1, class: "seg",
            fill: b & (1 << s) ? "#ff3b30" : "#3a1512" }).forEach(([k, v]) => r.setAttribute(k, v));
          r.onclick = () => { digit = d; segs[d] ^= 1 << s; render(); };
          svg.appendChild(r);
        });
      });
      ["10", "24"].forEach((cy) => {
        const c = document.createElementNS(NS, "circle");
        Object.entries({ cx: 50, cy, r: 2, class: "seg", fill: segs[1] & 0x80 ? "#ff3b30" : "#3a1512" })
          .forEach(([k, v]) => c.setAttribute(k, v));
        c.onclick = () => { segs[1] ^= 0x80; render(); };
        svg.appendChild(c);
      });
      document.getElementById("digitLabel").textContent = digit + 1;
      document.getElementById("code").textContent = code();
    }

    function name() { return Tools.pyName(nameEl.value, "tm1637"); }
    function code() {
      return `${name()}.write(bytes([${segs.map((b) => "0x" + b.toString(16).padStart(2, "0")).join(", ")}]))`;
    }

    SYMBOLS.forEach(([label, bits]) => {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = () => {
        segs[digit] = (segs[digit] & 0x80) | bits;
        digit = Math.min(3, digit + 1);
        render();
      };
      document.getElementById("symbols").appendChild(b);
    });
    document.getElementById("write").onclick = () => {
      const text = document.getElementById("text").value.padEnd(4, " ").slice(0, 4);
      const colon = segs[1] & 0x80;
      segs = [...text].map(encodeChar);
      segs[1] |= colon;
      render();
    };
    document.getElementById("colon").onclick = () => { segs[1] ^= 0x80; render(); };
    document.getElementById("clear").onclick = () => { segs = [0, 0, 0, 0]; render(); };
    nameEl.oninput = render;
    document.getElementById("copy").onclick = () => Tools.copy(code() + "\n");

    document.getElementById("insert").onclick = () => {
      const hex = segs.map((b) => b.toString(16).padStart(2, "0")).join("");
      Tools.insertBlocks(
        `<xml><block type="tm1637_segments"><mutation segs="${hex}"></mutation>` +
        `<field name="NAME">${Tools.escapeXml(name())}</field></block></xml>`,
        edit ? edit.blockId : undefined,
      );
    };

    if (edit && edit.segs) {
      segs = edit.segs.slice(0, 4);
      nameEl.value = edit.name || "tm1637";
      document.getElementById("insert").textContent = "Guardar en el bloque";
    }
    render();
  </script>
</body>
</html>
