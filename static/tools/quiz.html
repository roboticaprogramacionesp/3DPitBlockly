<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear ¡Échale coco!</title>
  <link rel="stylesheet" href="tools.css">
  <style>
    textarea, input[type="text"].wide {
      width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 8px; font-size: 14px; font-family: inherit;
    }
    textarea.code { font-family: monospace; font-size: 13px; }
    .q-edit { margin-top: 12px; }
    .q-edit .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .q-edit .head b { font-size: 15px; }
    .opt { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    .opt input[type="text"] { flex: 1; }
    .score { font-size: 40px; font-weight: 800; }
    .review li { margin-top: 8px; }
    .muted { color: var(--muted); font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Herramientas</a>
  <h1>✏️ Crear un ¡Échale coco!</h1>
  <div id="app"></div>

  <script src="tools.js"></script>
  <script src="../coco-core.js"></script>
  <script>
    /* ════════════════════════════════════════════════════════════════
       Editor de cuestionarios "¡Échale coco!" (los puede crear
       cualquiera) y "Ver un resultado" (el código que manda quien
       respondió). Se responde en la ventana flotante de la app
       (static/coco.js). Validación,
       compresión y texto seguro: static/coco-core.js.
       ════════════════════════════════════════════════════════════════ */
    const C = CocoCore, LIM = C.LIM;
    const BORRADOR = "3dpit-quiz-borrador";
    const app = document.getElementById("app");

    function el(tag, attrs, ...children) {
      const n = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => {
        if (k === "class") n.className = v;
        else if (k.startsWith("on")) n[k] = v;
        else if (k === "text") n.textContent = v;
        else n.setAttribute(k, v);
      });
      children.flat().forEach((c) => c != null && n.append(c));
      return n;
    }

    // URL de la app (para que el enlace abra 3DPit Blocks con el cuestionario).
    function appUrl() {
      try {
        if (Tools.embedded) return window.parent.location.origin + window.parent.location.pathname;
      } catch (_) {}
      return new URL("../../", location.href).href;
    }

    // Responder en la ventana flotante de la app (o abrir la app si esta
    // página se abrió sola).
    async function responderEnApp(quiz) {
      const limpio = C.sanitizar(quiz);
      if (Tools.embedded) {
        window.parent.postMessage({ type: "3dpit-coco-start", quiz: limpio }, location.origin);
      } else if (C.soportaEnlace) {
        location.href = appUrl() + "#quiz=" + (await C.comprimir(JSON.stringify(limpio)));
      }
    }

    // ════════════════════════ INICIO ════════════════════════
    function inicio() {
      app.innerHTML = "";
      app.append(
        el("p", { class: "subtitle", text: "Crea tus propias preguntas y compártelas con un enlace o un archivo. Quien las responda en la app te puede mandar su código de resultado." }),
        el("div", { class: "cards" },
          tarjeta("✏️", "Crear o editar", "Arma las preguntas y compártelas.", () => editor(cargarBorrador())),
          tarjeta("📂", "Abrir un archivo", "Abre un .quiz.json para editarlo o probarlo.", abrirArchivo),
          tarjeta("📊", "Ver un resultado", "Pega el código que te mandó quien respondió.", verResultado)),
      );
    }
    function tarjeta(icon, titulo, texto, onclick) {
      return el("button", { class: "panel", style: "text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px", onclick },
        el("span", { style: "font-size:28px", text: icon }), el("b", { text: titulo }), el("span", { class: "muted", text: texto }));
    }

    function abrirArchivo() {
      const input = el("input", { type: "file", accept: ".json,application/json" });
      input.onchange = async () => {
        const f = input.files[0];
        if (!f) return;
        if (f.size > LIM.bytes) return Tools.toast("El archivo es demasiado grande");
        try {
          const quiz = C.sanitizar(JSON.parse(await f.text()));
          app.innerHTML = "";
          app.append(el("div", { class: "panel" },
            el("h2", { style: "margin:0 0 6px", text: quiz.titulo }),
            el("p", { class: "muted", text: `${quiz.preguntas.length} preguntas` }),
            el("div", { class: "row", style: "margin-top:10px" },
              el("button", { class: "primary", text: "▶ Responder", onclick: () => responderEnApp(quiz) }),
              el("button", { text: "✏️ Editar", onclick: () => editor(quiz) }),
              el("button", { text: "← Inicio", onclick: inicio }))));
        } catch (_) {
          Tools.toast("El archivo no es un cuestionario válido");
        }
      };
      input.click();
    }

    // ════════════════════════ EDITOR ════════════════════════
    function cargarBorrador() {
      try {
        const b = localStorage.getItem(BORRADOR);
        if (b) return C.sanitizar(JSON.parse(b));
      } catch (_) {}
      return { formato: "3dpit-quiz", version: 1, titulo: "Mi ¡Échale coco!", descripcion: "", mostrarRespuestas: true, preguntas: [] };
    }
    function guardarBorrador(quiz) {
      try { localStorage.setItem(BORRADOR, JSON.stringify(quiz)); } catch (_) {}
    }

    const NUEVA = {
      opcion: () => ({ tipo: "opcion", texto: "", codigo: "", explicacion: "", opciones: ["", "", "", ""], correcta: 0 }),
      vf: () => ({ tipo: "vf", texto: "", codigo: "", explicacion: "", correcta: true }),
      corta: () => ({ tipo: "corta", texto: "", codigo: "", explicacion: "", correcta: "" }),
    };
    const NOMBRE_TIPO = { opcion: "Opción múltiple", vf: "Verdadero o falso", corta: "Respuesta corta" };

    function editor(quiz) {
      const save = () => guardarBorrador(quiz);
      app.innerHTML = "";
      const head = el("div", { class: "panel" },
        el("label", { class: "field" }, "Título", el("input", { type: "text", class: "wide", value: quiz.titulo, maxlength: LIM.titulo,
          oninput: (e) => { quiz.titulo = e.target.value; save(); } })),
        el("label", { class: "field", style: "margin-top:8px" }, "Indicaciones para quien responda (opcional)",
          el("textarea", { rows: 2, maxlength: LIM.texto, oninput: (e) => { quiz.descripcion = e.target.value; save(); } }, quiz.descripcion)),
        el("label", { class: "row", style: "margin-top:8px" },
          el("input", Object.assign({ type: "checkbox", onchange: (e) => { quiz.mostrarRespuestas = e.target.checked; save(); } }, quiz.mostrarRespuestas ? { checked: "" } : {})),
          "Mostrar la respuesta correcta después de cada pregunta"));
      const list = el("div", {});
      const actions = el("div", { class: "panel", style: "margin-top:12px" },
        el("div", { class: "row" },
          el("span", { class: "muted", text: "Agregar pregunta:" }),
          ...Object.keys(NUEVA).map((t) => el("button", { text: "+ " + NOMBRE_TIPO[t], onclick: () => {
            if (quiz.preguntas.length >= LIM.preguntas) return Tools.toast(`Máximo ${LIM.preguntas} preguntas`);
            quiz.preguntas.push(NUEVA[t]()); save(); dibujar(); } }))),
        el("div", { class: "row", style: "margin-top:10px" },
          el("button", { class: "primary", text: "▶ Probar", onclick: () => { const p = problemas(quiz); if (p) return Tools.toast(p); responderEnApp(quiz); } }),
          el("button", { text: "🔗 Copiar enlace", onclick: () => copiarEnlace(quiz) }),
          el("button", { text: "💾 Descargar archivo", onclick: () => descargar(quiz) }),
          el("button", { text: "📂 Abrir archivo", onclick: abrirArchivo }),
          el("button", { text: "🗑 Empezar de cero", onclick: () => {
            if (!confirm("¿Borrar todas las preguntas?")) return;
            try { localStorage.removeItem(BORRADOR); } catch (_) {}
            editor(cargarBorrador()); } })),
        el("p", { class: "hint", style: "margin-top:8px", text: "Se guarda solo en este navegador mientras lo editas. En los textos puedes usar **negrita** y *cursiva*." }));

      function dibujar() {
        list.innerHTML = "";
        quiz.preguntas.forEach((q, i) => list.appendChild(editorPregunta(quiz, q, i, save, dibujar)));
        if (!quiz.preguntas.length) list.appendChild(el("p", { class: "hint", style: "margin-top:12px", text: "Todavía no hay preguntas: agrega la primera abajo." }));
      }
      dibujar();
      app.append(head, list, actions);
    }

    function editorPregunta(quiz, q, i, save, redraw) {
      const box = el("div", { class: "panel q-edit" });
      const move = (d) => { const j = i + d; if (j < 0 || j >= quiz.preguntas.length) return;
        [quiz.preguntas[i], quiz.preguntas[j]] = [quiz.preguntas[j], quiz.preguntas[i]]; save(); redraw(); };
      box.append(
        el("div", { class: "head" }, el("b", { text: `${i + 1}. ${NOMBRE_TIPO[q.tipo]}` }),
          el("span", { class: "row" },
            el("button", { text: "↑", title: "Subir", onclick: () => move(-1) }),
            el("button", { text: "↓", title: "Bajar", onclick: () => move(1) }),
            el("button", { text: "🗑", title: "Borrar", onclick: () => { quiz.preguntas.splice(i, 1); save(); redraw(); } }))),
        el("textarea", { rows: 2, placeholder: "Pregunta", maxlength: LIM.texto, oninput: (e) => { q.texto = e.target.value; save(); } }, q.texto),
        el("details", Object.assign({ style: "margin-top:6px" }, q.codigo ? { open: "" } : {}),
          el("summary", { class: "muted", text: "Agregar código (para \"¿qué hace este código?\")" }),
          el("textarea", { class: "code", rows: 4, placeholder: "for i in range(3):\n    led.value(1)", maxlength: LIM.codigo,
            oninput: (e) => { q.codigo = e.target.value; save(); } }, q.codigo)));

      if (q.tipo === "opcion") {
        const name = "c" + i + "_" + Math.random().toString(36).slice(2);
        q.opciones.forEach((o, k) => box.appendChild(el("div", { class: "opt" },
          el("input", Object.assign({ type: "radio", name, title: "Respuesta correcta", onchange: () => { q.correcta = k; save(); } }, q.correcta === k ? { checked: "" } : {})),
          el("input", { type: "text", value: o, placeholder: `Opción ${k + 1}`, maxlength: LIM.opcion, oninput: (e) => { q.opciones[k] = e.target.value; save(); } }),
          q.opciones.length > 2 ? el("button", { text: "✕", title: "Quitar opción", onclick: () => {
            q.opciones.splice(k, 1); if (q.correcta >= q.opciones.length) q.correcta = 0; save(); redraw(); } }) : null)));
        if (q.opciones.length < LIM.opciones) box.appendChild(el("button", { style: "margin-top:6px", text: "+ Opción", onclick: () => { q.opciones.push(""); save(); redraw(); } }));
        box.appendChild(el("p", { class: "hint", style: "margin-top:4px", text: "Marca con el círculo la opción correcta." }));
      } else if (q.tipo === "vf") {
        const name = "vf" + i + "_" + Math.random().toString(36).slice(2);
        box.appendChild(el("div", { class: "row", style: "margin-top:8px" }, "Respuesta correcta:",
          ...[true, false].map((v) => el("label", { class: "row" },
            el("input", Object.assign({ type: "radio", name, onchange: () => { q.correcta = v; save(); } }, q.correcta === v ? { checked: "" } : {})),
            v ? "Verdadero" : "Falso"))));
      } else {
        box.appendChild(el("label", { class: "field", style: "margin-top:8px" },
          "Respuestas aceptadas (separa varias con | ; no importan mayúsculas ni acentos)",
          el("input", { type: "text", class: "wide", value: q.correcta, placeholder: "3 | tres", maxlength: LIM.respuesta * 4,
            oninput: (e) => { q.correcta = e.target.value; save(); } })));
      }
      box.appendChild(el("label", { class: "field", style: "margin-top:8px" }, "Explicación (se muestra al responder, opcional)",
        el("textarea", { rows: 2, maxlength: LIM.explicacion, oninput: (e) => { q.explicacion = e.target.value; save(); } }, q.explicacion)));
      return box;
    }

    function problemas(quiz) {
      if (!quiz.preguntas.length) return "Agrega al menos una pregunta.";
      for (let i = 0; i < quiz.preguntas.length; i++) {
        const q = quiz.preguntas[i];
        if (!q.texto.trim() && !q.codigo.trim()) return `La pregunta ${i + 1} no tiene texto.`;
        if (q.tipo === "opcion" && q.opciones.some((o) => !o.trim())) return `La pregunta ${i + 1} tiene una opción vacía.`;
        if (q.tipo === "corta" && !q.correcta.trim()) return `La pregunta ${i + 1} no tiene respuesta aceptada.`;
      }
      return null;
    }
    async function copiarEnlace(quiz) {
      const p = problemas(quiz);
      if (p) return Tools.toast(p);
      if (!C.soportaEnlace) return Tools.toast("Este navegador no puede crear enlaces: usa el archivo");
      const datos = await C.comprimir(JSON.stringify(C.sanitizar(quiz)));
      if (datos.length > LIM.enlace) return Tools.toast("Es demasiado grande para un enlace: usa el archivo");
      await Tools.copy(appUrl() + "#quiz=" + datos);
      Tools.toast("Enlace copiado: compártelo");
    }
    function descargar(quiz) {
      const p = problemas(quiz);
      if (p) return Tools.toast(p);
      const blob = new Blob([JSON.stringify(C.sanitizar(quiz), null, 1)], { type: "application/json" });
      const a = el("a", { href: URL.createObjectURL(blob), download: (quiz.titulo || "echale-coco").replace(/[^\w\- áéíóúñÁÉÍÓÚÑ]/g, "").trim() + ".quiz.json" });
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // ════════════════════════ VER RESULTADO ════════════════════════
    function verResultado() {
      app.innerHTML = "";
      const input = el("textarea", { rows: 3, placeholder: "3DPIT-..." });
      const out = el("div", { style: "margin-top:12px" });
      app.append(el("div", { class: "panel" },
        el("label", { class: "field" }, "Pega el código de resultado que te mandaron", input),
        el("div", { class: "row", style: "margin-top:8px" },
          el("button", { class: "primary", text: "Ver", onclick: async () => {
            out.innerHTML = "";
            try {
              const raw = input.value.trim().replace(/^3DPIT-/, "").replace(/\s+/g, "");
              const r = JSON.parse(await C.descomprimir(raw));
              if (!r || r.formato !== "3dpit-quiz-resultado") throw new Error();
              const lista = el("ol", { class: "review" });
              (Array.isArray(r.respuestas) ? r.respuestas : []).slice(0, LIM.preguntas).forEach((a) =>
                lista.appendChild(el("li", {}, el("span", { text: a && a.ok === true ? "✅ " : "❌ " }), el("span", { text: C.str(a && a.p, 200) }),
                  el("div", { class: "muted", text: "Respondió: " + (C.str(a && a.r, LIM.respuesta) || "—") }))));
              out.append(el("div", { class: "panel" },
                el("p", { class: "muted", text: `${C.str(r.titulo, LIM.titulo)} · ${C.str(r.fecha, 20).replace("T", " ")}` }),
                el("h2", { style: "margin:0", text: C.str(r.nombre, LIM.nombre) || "(sin nombre)" }),
                el("div", { class: "score", text: `${Number(r.puntos) | 0} / ${Number(r.total) | 0}` }), lista,
                el("p", { class: "hint", text: "El código lo genera el navegador de quien respondió: sirve para revisar, pero no es a prueba de trampas." })));
            } catch (_) {
              out.append(el("p", { text: "⚠️ El código no es válido o está incompleto." }));
            }
          } }),
          el("button", { text: "← Inicio", onclick: inicio }))), out);
    }

    // Un enlace viejo que apunte a esta página se manda a la app, que es
    // donde se responde.
    if ((location.hash || "").startsWith("#quiz=")) location.replace(appUrl() + location.hash);
    else inicio();
  </script>
</body>
</html>
