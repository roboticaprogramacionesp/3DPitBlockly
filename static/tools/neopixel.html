<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor NeoPixel</title>
  <link rel="stylesheet" href="tools.css">
</head>
<body>
  <a class="back" href="index.html">← Herramientas</a>
  <h1>🌈 Matriz NeoPixel a colores</h1>
  <p class="subtitle">Elige un color y dibuja. El borrador apaga los LEDs (negro).</p>

  <div class="layout">
    <div>
      <div class="canvas-wrap"><canvas id="screen"></canvas></div>
      <div class="coords" id="coords">x: – y: –</div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="row">
          <label class="field">Tamaño
            <select id="preset">
              <option value="4x4">4 × 4</option>
              <option value="5x5">5 × 5</option>
              <option value="8x8" selected>8 × 8</option>
              <option value="16x8">16 × 8</option>
              <option value="32x8">32 × 8</option>
              <option value="16x16">16 × 16</option>
              <option value="32x32">32 × 32</option>
              <option value="custom">Otro…</option>
            </select>
          </label>
          <label class="field" data-custom>Ancho <input type="number" id="w" min="1" max="64" value="8"></label>
          <label class="field" data-custom>Alto <input type="number" id="h" min="1" max="64" value="8"></label>
          <label class="field">Nombre
            <input type="text" id="name" size="12" value="matriz">
          </label>
        </div>
      </div>

      <div class="panel" id="palette"></div>

      <div class="panel" id="toolbar"></div>

      <div class="panel" id="imagePanel"></div>

      <div class="panel">
        <div class="row">
          <button class="primary" id="insert" data-embedded-only>Insertar en mis bloques</button>
          <button id="copy">Copiar código</button>
        </div>
        <p class="hint" style="margin-top:8px">Necesitas antes el bloque <b>iniciar matriz NeoPixel</b> con el mismo nombre y tamaño (sirven también los de 5x5 y 8x8). El orden en zigzag se configura en ese bloque.</p>
      </div>
    </div>
  </div>

  <script src="tools.js"></script>
  <script src="pixel-editor.js"></script>
  <script>
    const presetEl = document.getElementById("preset");
    const wEl = document.getElementById("w");
    const hEl = document.getElementById("h");
    const nameEl = document.getElementById("name");
    const edit = Tools.editPayload();
    const color = Tools.palette(document.getElementById("palette"));

    const ed = PixelEditor({
      canvas: document.getElementById("screen"),
      toolbar: document.getElementById("toolbar"),
      imagePanel: document.getElementById("imagePanel"),
      coords: document.getElementById("coords"),
      mode: "color",
      shape: "round",
      color,
    });

    function build(w, h) {
      ed.resize(Math.max(1, Math.min(64, w | 0)), Math.max(1, Math.min(64, h | 0)));
      wEl.value = ed.w; hEl.value = ed.h;
    }
    function showCustom(on) {
      document.querySelectorAll("[data-custom]").forEach((el) => (el.hidden = !on));
    }
    presetEl.onchange = () => {
      const custom = presetEl.value === "custom";
      showCustom(custom);
      if (custom) return;
      const [w, h] = presetEl.value.split("x").map(Number);
      ed.snapshot();
      build(w, h);
    };
    wEl.onchange = hEl.onchange = () => { ed.snapshot(); build(Number(wEl.value), Number(hEl.value)); };

    // RGB565 little-endian: lo que guarda el bloque neopixel_image y lee
    // NeoMatrix.show() en el ESP32.
    function to565(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return ((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3);
    }
    function from565(c) {
      const r = ((c >> 11) & 0x1f) * 255 / 31, g = ((c >> 5) & 0x3f) * 255 / 63, b = (c & 0x1f) * 255 / 31;
      return "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
    }
    function dataHex() {
      return ed.values.map((p) => {
        const c = to565(p);
        return (c & 0xff).toString(16).padStart(2, "0") + (c >> 8).toString(16).padStart(2, "0");
      }).join("");
    }
    function name() { return Tools.pyName(nameEl.value, "matriz"); }

    document.getElementById("copy").onclick = () => {
      Tools.copy(`import framebuf

${name()}.blit(framebuf.FrameBuffer(bytearray(bytes.fromhex('${dataHex()}')), ${ed.w}, ${ed.h}, framebuf.RGB565), 0, 0)
${name()}.show()
`);
    };

    document.getElementById("insert").onclick = () => {
      const n = Tools.escapeXml(name());
      const image =
        `<mutation w="${ed.w}" h="${ed.h}" data="${dataHex()}"></mutation>` +
        `<field name="NAME">${n}</field>`;
      if (edit) {
        Tools.insertBlocks(`<xml><block type="neopixel_image">${image}</block></xml>`, edit.blockId);
        return;
      }
      Tools.insertBlocks(
        `<xml><block type="neopixel_image">${image}${Tools.xy()}` +
        `<next><block type="neopixel_show"><field name="NAME">${n}</field><field name="BRIGHT">50</field></block></next>` +
        `</block></xml>`,
      );
    };

    // Arranque: con el dibujo del bloque que se está editando, o 8×8 vacío.
    if (edit) {
      nameEl.value = edit.name || "matriz";
      const preset = `${edit.w}x${edit.h}`;
      const known = Array.from(presetEl.options).some((o) => o.value === preset);
      presetEl.value = known ? preset : "custom";
      showCustom(!known);
      build(edit.w, edit.h);
      const values = [];
      for (let i = 0; i < ed.w * ed.h; i++) {
        const lo = parseInt(edit.data.substr(i * 4, 2), 16) || 0;
        const hi = parseInt(edit.data.substr(i * 4 + 2, 2), 16) || 0;
        values.push(from565(lo | (hi << 8)));
      }
      ed.setValues(values);
      document.getElementById("insert").textContent = "Guardar en el bloque";
    } else {
      showCustom(false);
      build(8, 8);
    }
  </script>
</body>
</html>
