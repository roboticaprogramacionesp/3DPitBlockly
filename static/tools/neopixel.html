<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor NeoPixel</title>
  <link rel="stylesheet" href="tools.css">
  <style>
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      width: 34px; height: 34px; min-height: 0; padding: 0;
      border-radius: 50%; border: 2px solid var(--line);
    }
    .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
    input[type="color"] {
      width: 44px; height: 34px; padding: 0; border: 1px solid var(--line);
      border-radius: 6px; background: var(--panel-2);
    }
    .grid .cell { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Herramientas</a>
  <h1>🌈 Matriz NeoPixel a colores</h1>
  <p class="subtitle">Elige un color y pinta arrastrando sobre los LEDs. Para borrar, pinta con negro (apagado).</p>

  <div class="layout">
    <div class="grid" id="grid"></div>

    <div class="side">
      <div class="panel">
        <p class="section-title">Matriz</p>
        <div class="row">
          <label class="field">Tamaño
            <select id="size">
              <option value="8">8 × 8</option>
              <option value="5">5 × 5</option>
            </select>
          </label>
          <label class="field">Nombre
            <input type="text" id="name" size="12">
          </label>
        </div>
      </div>

      <div class="panel">
        <p class="section-title">Color</p>
        <div class="swatches" id="swatches"></div>
        <div class="row" style="margin-top:8px">
          <input type="color" id="custom" value="#ff00ff" title="Otro color">
          <span class="hint">Otro color</span>
        </div>
      </div>

      <div class="panel row">
        <button id="fill">Rellenar todo</button>
        <button id="clear">Limpiar</button>
      </div>

      <div class="panel">
        <div class="row">
          <button class="primary" id="insert" data-embedded-only>Insertar en mis bloques</button>
          <button id="copy">Copiar código</button>
        </div>
        <p class="hint" style="margin-top:8px">Necesitas antes el bloque <b>iniciar NeoPixel</b> del mismo tamaño y con el mismo nombre. El orden en zigzag se configura en ese bloque.</p>
      </div>
    </div>
  </div>

  <script src="tools.js"></script>
  <script>
    const PALETTE = [
      ["Apagado", "#000000"], ["Rojo", "#ff0000"], ["Naranja", "#ff8000"],
      ["Amarillo", "#ffff00"], ["Verde", "#00ff00"], ["Cian", "#00ffff"],
      ["Azul", "#0000ff"], ["Morado", "#8000ff"], ["Rosa", "#ff0080"],
      ["Blanco", "#ffffff"],
    ];
    const gridEl = document.getElementById("grid");
    const sizeEl = document.getElementById("size");
    const nameEl = document.getElementById("name");
    const customEl = document.getElementById("custom");
    let size = 8;
    let pixels = [];
    let cells = [];
    let color = "#ff0000";

    const swatchEls = PALETTE.map(([label, hex]) => {
      const b = document.createElement("button");
      b.className = "swatch";
      b.title = label;
      b.style.background = hex;
      b.onclick = () => selectColor(hex, b);
      document.getElementById("swatches").appendChild(b);
      return b;
    });
    function selectColor(hex, el) {
      color = hex;
      swatchEls.forEach((s) => s.classList.toggle("active", s === el));
    }
    selectColor("#ff0000", swatchEls[1]);
    customEl.oninput = () => selectColor(customEl.value, null);

    function draw(i) {
      cells[i].style.background = pixels[i] === "#000000" ? "" : pixels[i];
    }

    function build(newSize) {
      const old = pixels, oldSize = size;
      size = newSize;
      pixels = [];
      // Al cambiar de tamaño se conserva la esquina superior izquierda.
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++)
          pixels.push(x < oldSize && y < oldSize && old.length ? old[y * oldSize + x] : "#000000");
      cells = Tools.paintGrid(gridEl, size, size, (i) => { pixels[i] = color; draw(i); });
      pixels.forEach((_, i) => draw(i));
      nameEl.value = `neopixel${size}x${size}`;
    }
    build(8);
    sizeEl.onchange = () => build(Number(sizeEl.value));

    document.getElementById("fill").onclick = () => { pixels.fill(color); pixels.forEach((_, i) => draw(i)); };
    document.getElementById("clear").onclick = () => { pixels.fill("#000000"); pixels.forEach((_, i) => draw(i)); };

    // Mismo código que genera el bloque neopixel_5x5 / neopixel_8x8.
    function to565(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return ((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3);
    }
    function name() { return Tools.pyName(nameEl.value, `neopixel${size}x${size}`); }

    document.getElementById("copy").onclick = () => {
      Tools.copy(`img = [${pixels.map(to565).join(",")}]

for i,c in enumerate(img):
    x = i % ${size}
    y = i // ${size}
    ${name()}.pixel(x,y,c)
`);
    };

    document.getElementById("insert").onclick = () => {
      let fields = `<field name="NAME">${Tools.escapeXml(name())}</field>`;
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++)
          fields += `<field name="COLOR_${y}_${x}">${pixels[y * size + x]}</field>`;
      Tools.insertBlocks(`<xml><block type="neopixel_${size}x${size}">${fields}</block></xml>`);
    };
  </script>
</body>
</html>
