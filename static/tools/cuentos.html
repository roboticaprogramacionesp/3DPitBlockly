<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini cuentos</title>
  <link rel="stylesheet" href="tools.css">
  <style>
    /* Tamaño de letra del cuento: lo elige el lector (A− / A+). */
    body { --fs: 17px; }
    .back { font-size: 16px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 0; }
    .portada, .lista-wrap { max-width: 1100px; margin: 0 auto; }
    .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 14px; }
    .barra .espacio { flex: 1; }
    .filtros button { border-radius: 999px; }
    .lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .cuento {
      display: flex; flex-direction: column; gap: 6px; text-align: left;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
      color: var(--text); font: inherit; cursor: pointer; transition: transform .15s, border-color .15s;
    }
    .cuento:hover { border-color: var(--accent-2); background: var(--panel-2); transform: translateY(-3px); }
    .cuento .icono { font-size: 36px; }
    .cuento h3 { margin: 0; font-size: 16px; }
    .cuento p { margin: 0; font-size: 13px; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
    .chip.real { color: #ffd479; border-color: #7a6326; }
    .chip.ficcion { color: #9fe3ff; border-color: #2f6b80; }
    .chip.leido { color: var(--ok); border-color: #1f7a47; }
    .chip.mx { color: #7ee2a8; border-color: #2c7a4b; }
    .cuento .fila { display: flex; justify-content: space-between; align-items: flex-start; }
    .cuento .num { font-size: 12px; color: var(--muted); }
    .cuento.visto { opacity: .85; }
    .progreso { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; margin-bottom: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .progreso .txt { font-weight: 700; }
    .progreso .avance { flex: 1 1 200px; margin: 0; }
    .progreso button { font-size: 15px; padding: 9px 16px; border-radius: 10px; }
    .filtros { margin: 0 0 8px; }
    .filtros .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
    input.buscar { flex: 1 1 260px; max-width: 420px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; font-size: 15px; }
    .siguiente { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px; border: 1px dashed var(--accent-2); border-radius: 10px; cursor: pointer; background: none; color: var(--text); font: inherit; text-align: left; width: 100%; }
    .siguiente:hover { background: var(--panel-2); }
    .siguiente .icono { font-size: 30px; }

    /* ── Lector ── */
    .lector { max-width: 860px; margin: 0 auto; }
    .volver { font-size: 16px; font-weight: 700; padding: 10px 16px; border-radius: 10px; }
    .volver .flecha { font-size: 20px; line-height: 1; margin-right: 4px; }
    .herr button { font-size: 15px; padding: 9px 14px; border-radius: 10px; }
    .herr button.hablando { background: #a2573b; border-color: #e67e22; }
    .cabeza {
      display: flex; align-items: center; gap: 18px; padding: 16px 20px; border-radius: 14px; margin-bottom: 14px;
      background: linear-gradient(120deg, #2c2566, #1f2447 70%); border: 1px solid var(--line);
    }
    .cabeza.ficcion { background: linear-gradient(120deg, #17485a, #1f2447 70%); }
    .cabeza .grande { font-size: 64px; line-height: 1; animation: flotar 3s ease-in-out infinite; }
    @keyframes flotar { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
    .cabeza h2 { margin: 0 0 6px; font-size: calc(var(--fs) + 6px); }
    .cabeza .parte { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .avance { height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .avance div { height: 100%; background: linear-gradient(90deg, var(--accent), #f1c40f); transition: width .4s; }
    .escena { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px; }
    .escena.error { border-color: #a2573b; background: #2b2140; }
    .escena p { font-size: var(--fs); line-height: 1.65; margin: 0 0 14px; animation: aparecer .5s both; }
    @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .escena .aviso { font-weight: 700; color: #ffb38a; margin-bottom: 10px; font-size: calc(var(--fs) + 1px); }
    .dato { position: relative; margin: 8px 0 14px; padding: 12px 56px 12px 16px; border-left: 4px solid #f1c40f; background: #2a2a3f; border-radius: 8px; font-size: calc(var(--fs) - 1px); line-height: 1.55; animation: aparecer .5s .2s both; }
    .dato b.t { display: block; color: #f1c40f; margin-bottom: 2px; }
    .dato button { position: absolute; top: 10px; right: 10px; font-size: 18px; padding: 4px 9px; }
    .pregunta { font-weight: 700; font-size: calc(var(--fs) + 1px); margin: 16px 0 10px; }
    .opciones { display: grid; gap: 10px; }
    .opciones button {
      display: flex; gap: 12px; align-items: center; text-align: left; font-size: var(--fs); padding: 12px 16px; line-height: 1.4;
      border-radius: 12px; transition: transform .12s, border-color .12s;
    }
    .opciones button:hover { transform: translateX(4px); }
    .opciones .letra { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); font-weight: 800; }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .acciones button { font-size: var(--fs); padding: 10px 18px; border-radius: 10px; }

    .quiz .q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 12px; }
    .quiz .q p { margin: 0 0 8px; font-weight: 700; font-size: var(--fs); }
    .quiz .q button { display: block; width: 100%; text-align: left; margin-top: 8px; font-size: calc(var(--fs) - 1px); padding: 10px 14px; border-radius: 10px; }
    .quiz .q button.bien { background: #1f6f45; border-color: var(--ok); }
    .quiz .q button.mal { background: #7a2e2e; border-color: #e74c3c; }
    .quiz .q .exp { margin-top: 8px; font-size: calc(var(--fs) - 2px); color: var(--muted); }
    .palabras dt { font-weight: 700; font-size: var(--fs); margin-top: 8px; }
    .palabras dd { margin: 2px 0 0 0; color: var(--muted); font-size: calc(var(--fs) - 1px); }
    .puntaje { font-size: 40px; font-weight: 800; margin: 4px 0; }
    @media (max-width: 560px) {
      .cabeza { flex-direction: column; text-align: center; }
      .cabeza .chips { justify-content: center; }
      .escena { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="portada" id="portada">
    <a class="back" href="index.html">⬅ Herramientas</a>
    <h1>📚 Mini cuentos</h1>
    <p class="subtitle">Historias cortas de electrónica y programación, unas reales y otras inventadas. En algunas partes tú decides qué pasa.</p>
  </div>
  <div id="app"></div>

  <script src="tools.js"></script>
  <script src="cuentos-data.js"></script>
  <script src="cuentos-data-2.js"></script>
  <script src="cuentos-data-3.js"></script>
  <script src="cuentos-data-4.js"></script>
  <script>
    const app = document.getElementById("app");
    const portada = document.getElementById("portada");
    const GUARDADO = "3dpit-cuentos";
    const LETRA = "3dpit-cuentos-letra";
    const TAMANOS = [15, 17, 19, 21, 24];

    let leidos = {};
    try { leidos = JSON.parse(localStorage.getItem(GUARDADO) || "{}") || {}; } catch (_) {}
    function guardar() { try { localStorage.setItem(GUARDADO, JSON.stringify(leidos)); } catch (_) {} }

    let letra = 1;
    try { const g = parseInt(localStorage.getItem(LETRA), 10); if (g >= 0 && g < TAMANOS.length) letra = g; } catch (_) {}
    function aplicarLetra() {
      document.body.style.setProperty("--fs", TAMANOS[letra] + "px");
      try { localStorage.setItem(LETRA, letra); } catch (_) {}
    }
    aplicarLetra();

    function el(tag, attrs, ...hijos) {
      const n = document.createElement(tag);
      Object.entries(attrs || {}).forEach(([k, v]) => {
        if (k === "class") n.className = v;
        else if (k === "html") n.innerHTML = v;
        else if (k.startsWith("on")) n[k] = v;
        else if (k === "text") n.textContent = v;
        else n.setAttribute(k, v);
      });
      hijos.flat().forEach((c) => c != null && n.append(c));
      return n;
    }

    // Las opciones salen en otro orden cada vez, para que no se adivine por el lugar.
    function revolver(lista) {
      const a = lista.slice();
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    // ── Leer en voz alta (si el navegador lo permite) ──
    const voz = "speechSynthesis" in window;
    let botonHablando = null;
    function callar() {
      if (voz) speechSynthesis.cancel();
      marcar(null);
    }
    // El botón que está leyendo cambia a "Detener".
    function marcar(boton) {
      if (botonHablando) { botonHablando.classList.remove("hablando"); botonHablando.innerHTML = botonHablando.dataset.normal; }
      botonHablando = boton;
      if (boton) { boton.classList.add("hablando"); boton.innerHTML = boton.dataset.detener; }
    }
    function sinEtiquetas(html) {
      const tmp = document.createElement("div");
      tmp.innerHTML = html.replace(/<br>/g, ". ");
      return tmp.textContent;
    }
    function hablar(partes, boton) {
      if (!voz) return;
      if (botonHablando === boton) { callar(); return; }
      callar();
      const u = new SpeechSynthesisUtterance(partes.map(sinEtiquetas).join(" "));
      u.lang = "es-MX";
      const voces = speechSynthesis.getVoices();
      const v = voces.find((x) => x.lang === "es-MX") || voces.find((x) => x.lang.startsWith("es"));
      if (v) u.voice = v;
      u.rate = 0.95;
      u.onend = () => { if (botonHablando === boton) marcar(null); };
      marcar(boton);
      speechSynthesis.speak(u);
    }
    function botonVoz(normal, detener, partes, titulo) {
      const b = el("button", { title: titulo, html: normal });
      b.dataset.normal = normal;
      b.dataset.detener = detener;
      b.onclick = () => hablar(partes, b);
      return b;
    }

    function barraLetra() {
      return [
        el("button", { title: "Letra más chica", onclick: () => { if (letra > 0) { letra--; aplicarLetra(); } } }, "A−"),
        el("button", { title: "Letra más grande", onclick: () => { if (letra < TAMANOS.length - 1) { letra++; aplicarLetra(); } } }, "A+"),
      ];
    }
    const etiquetaTipo = (c) => el("span", { class: "chip " + c.tipo, text: c.tipo === "real" ? "⭐ Pasó de verdad" : "✨ Ficción" });
    function volver() {
      return el("button", { class: "volver", onclick: lista, html: '<span class="flecha">⬅</span> Volver a los cuentos' });
    }

    // ── Lista de cuentos ──
    const AREAS = {
      electricidad: "⚡ Electricidad", programacion: "💻 Programación", comunicacion: "📡 Comunicación",
      espacio: "🚀 Espacio", sensores: "🤖 Sensores y robots",
    };
    // Filtros de la lista (se conservan al volver de un cuento).
    const F = { tipo: "todos", area: "", buscar: "", mx: false, sinLeer: false };
    const sinAcentos = (t) => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    function filtrados() {
      const q = sinAcentos(F.buscar.trim());
      return CUENTOS.filter((c) =>
        (F.tipo === "todos" || c.tipo === F.tipo) &&
        (!F.area || c.area === F.area) &&
        (!F.mx || c.mx) &&
        (!F.sinLeer || !leidos[c.id]) &&
        (!q || sinAcentos(c.titulo + " " + c.tema + " " + c.resumen).includes(q)));
    }
    // Un cuento sin leer al azar (si ya leyó todos, cualquiera).
    function sorpresa(lista) {
      const pend = lista.filter((c) => !leidos[c.id]);
      const de = pend.length ? pend : lista;
      return de[Math.floor(Math.random() * de.length)];
    }

    function lista() {
      callar();
      portada.hidden = false;
      app.innerHTML = "";
      const nLeidos = CUENTOS.filter((c) => leidos[c.id]).length;
      const tarjetas = el("div", { class: "lista" });
      const cuenta = el("span", { class: "hint" });
      function pintar() {
        const ls = filtrados();
        cuenta.textContent = ls.length === CUENTOS.length ? `${ls.length} cuentos` : `Mostrando ${ls.length} de ${CUENTOS.length}`;
        tarjetas.innerHTML = "";
        if (!ls.length) tarjetas.append(el("p", { class: "hint", text: "No hay cuentos con esos filtros." }));
        ls.forEach((c) => {
          const l = leidos[c.id];
          tarjetas.append(el("button", { class: "cuento" + (l ? " visto" : ""), onclick: () => leer(c) },
            el("div", { class: "fila" }, el("span", { class: "icono", text: c.icono }), el("span", { class: "num", text: "N.º " + (CUENTOS.indexOf(c) + 1) })),
            el("h3", { text: c.titulo }),
            el("p", { text: c.resumen }),
            el("div", { class: "chips" },
              etiquetaTipo(c),
              c.mx ? el("span", { class: "chip mx", text: "🦅 México" }) : null,
              el("span", { class: "chip", text: AREAS[c.area] || c.tema }),
              el("span", { class: "chip", text: `⏱ ${c.minutos} min` }),
              l ? el("span", { class: "chip leido", text: `✓ ${l.aciertos}/${l.total}` }) : null)));
        });
      }
      const boton = (texto, activo, accion) => el("button", { class: activo ? "active" : "", onclick: () => { accion(); lista(); } }, texto);
      const caja = el("input", { type: "search", class: "buscar", placeholder: "🔎 Buscar un cuento…", value: F.buscar });
      caja.oninput = () => { F.buscar = caja.value; pintar(); };
      app.append(el("div", { class: "lista-wrap" },
        el("div", { class: "progreso" },
          el("div", { class: "txt", text: `📖 Has leído ${nLeidos} de ${CUENTOS.length} cuentos` }),
          el("div", { class: "avance" }, el("div", { style: `width:${Math.round((nLeidos / CUENTOS.length) * 100)}%` })),
          el("button", { class: "primary", onclick: () => leer(sorpresa(filtrados().length ? filtrados() : CUENTOS)) }, "🎲 Sorpréndeme")),
        el("div", { class: "barra filtros" },
          boton("Todos", F.tipo === "todos", () => (F.tipo = "todos")),
          boton("⭐ Reales", F.tipo === "real", () => (F.tipo = "real")),
          boton("✨ Ficción", F.tipo === "ficcion", () => (F.tipo = "ficcion")),
          el("span", { class: "sep" }),
          boton("🦅 De México", F.mx, () => (F.mx = !F.mx)),
          boton("📕 Sin leer", F.sinLeer, () => (F.sinLeer = !F.sinLeer))),
        el("div", { class: "barra filtros" },
          boton("Todas las áreas", !F.area, () => (F.area = "")),
          Object.entries(AREAS).map(([k, t]) => boton(t, F.area === k, () => (F.area = F.area === k ? "" : k)))),
        el("div", { class: "barra" }, caja, el("span", { class: "espacio" }), cuenta),
        tarjetas));
      pintar();
      window.scrollTo(0, 0);
    }

    // ── Leer un cuento ──
    function leer(c) {
      const total = Object.values(c.escenas).filter((e) => !e.error).length;
      const vistas = new Set();
      let errores = 0;

      function cabeza(texto) {
        return el("div", { class: "cabeza " + c.tipo },
          el("div", { class: "grande", text: c.icono }),
          el("div", { style: "flex:1" },
            el("h2", { text: c.titulo }),
            el("div", { class: "chips" }, etiquetaTipo(c), el("span", { class: "chip", text: c.tema })),
            el("div", { class: "parte", text: texto }),
            el("div", { class: "avance" }, el("div", { style: `width:${Math.round((vistas.size / total) * 100)}%` }))));
      }

      function mostrar(id) {
        callar();
        portada.hidden = true;
        const e = c.escenas[id];
        if (!e.error) vistas.add(id);
        const opciones = e.opciones ? revolver(e.opciones) : null;
        // Lo que lee el botón 🔊: el texto, el dato y la pregunta con sus opciones.
        const todo = e.texto.slice();
        if (e.dato) todo.push("¿Sabías que? " + e.dato);
        if (e.pregunta) todo.push(e.pregunta, ...opciones.map((o, i) => `Opción ${"ABC"[i]}: ${o.t}.`));
        app.innerHTML = "";
        app.append(el("div", { class: "lector" },
          el("div", { class: "barra herr" },
            volver(),
            el("span", { class: "espacio" }),
            voz ? botonVoz("🔊 Escuchar", "⏹ Detener", todo, "Escuchar esta parte") : null,
            barraLetra()),
          cabeza(e.error ? "Un camino que no funcionó" : `Parte ${vistas.size} de ${total}`),
          escena(e, opciones)));
        window.scrollTo(0, 0);
      }

      function escena(e, opciones) {
        const caja = el("div", { class: "escena" + (e.error ? " error" : "") });
        if (e.error) caja.append(el("div", { class: "aviso", text: "🤔 Mmm... eso no funcionó" }));
        e.texto.forEach((t, i) => caja.append(el("p", { html: t, style: `animation-delay:${i * 0.15}s` })));
        if (e.dato) {
          caja.append(el("div", { class: "dato", html: `<b class="t">💡 ¿Sabías que...?</b>${e.dato}` },
            voz ? botonVoz("🔊", "⏹", ["¿Sabías que? " + e.dato], "Escuchar el dato") : null));
        }
        if (opciones) {
          caja.append(el("div", { class: "pregunta", text: "👉 " + e.pregunta }));
          caja.append(el("div", { class: "opciones" }, opciones.map((o, i) =>
            el("button", { onclick: () => { if (c.escenas[o.ir].error) errores++; mostrar(o.ir); } },
              el("span", { class: "letra", text: "ABC"[i] }), el("span", { text: o.t })))));
        } else if (e.fin) {
          caja.append(el("div", { class: "acciones" },
            el("button", { class: "primary", onclick: preguntas }, "Terminar y contestar preguntas →")));
        } else {
          caja.append(el("div", { class: "acciones" },
            el("button", { class: "primary", onclick: () => mostrar(e.sig) }, e.error ? "↩ Intentar otra vez" : "Continuar →")));
        }
        return caja;
      }

      // ── Preguntas de comprensión y palabras nuevas ──
      function preguntas() {
        callar();
        let contestadas = 0, aciertos = 0;
        app.innerHTML = "";
        const final = el("div", { class: "panel", hidden: "" });
        const quiz = el("div", { class: "quiz" }, c.preguntas.map((q, i) => {
          const caja = el("div", { class: "q" }, el("p", { text: `${i + 1}. ${q.p}` }));
          const botones = q.o.map((t, k) => el("button", {
            onclick: () => {
              botones.forEach((b) => (b.disabled = true));
              botones[q.c].classList.add("bien");
              if (k === q.c) aciertos++; else botones[k].classList.add("mal");
              caja.append(el("div", { class: "exp", text: (k === q.c ? "✅ ¡Correcto! " : "❌ ") + q.e }));
              if (++contestadas === c.preguntas.length) terminar();
            },
          }, t));
          caja.append(...revolver(botones));
          return caja;
        }));

        function terminar() {
          const antes = leidos[c.id];
          if (!antes || aciertos >= antes.aciertos) leidos[c.id] = { aciertos, total: c.preguntas.length };
          guardar();
          final.hidden = false;
          final.append(
            el("div", { class: "puntaje", text: `${aciertos} de ${c.preguntas.length}` }),
            el("p", { class: "hint", text: aciertos === c.preguntas.length ? "¡Entendiste todo el cuento! 🎉" : "Puedes leerlo otra vez y volver a intentarlo." }),
            el("p", { class: "hint", text: errores
              ? `En el cuento tomaste ${errores === 1 ? "un camino que no funcionó" : errores + " caminos que no funcionaron"} y lo volviste a intentar. ¡Así se aprende!`
              : "Elegiste bien a la primera en todas las decisiones. 👏" }),
            el("div", { class: "acciones" },
              el("button", { onclick: () => leer(c) }, "📖 Leer otra vez"),
              el("button", { class: "primary", onclick: lista }, "Otros cuentos")));
          // Siguiente cuento sugerido: uno sin leer de la misma área (o cualquiera sin leer).
          const pend = CUENTOS.filter((o) => o !== c && !leidos[o.id]);
          const sig = pend.find((o) => o.area === c.area) || pend[0];
          if (sig) final.append(el("button", { class: "siguiente", onclick: () => leer(sig) },
            el("span", { class: "icono", text: sig.icono }),
            el("span", {}, el("div", { class: "hint", text: "Te sugerimos leer:" }), el("b", { text: sig.titulo }))));
          final.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        app.append(el("div", { class: "lector" },
          el("div", { class: "barra herr" }, volver(), el("span", { class: "espacio" }), barraLetra()),
          cabeza("✏️ ¿Qué entendiste? Contesta las preguntas"),
          quiz,
          el("div", { class: "panel" },
            el("div", { class: "section-title", text: "📖 Palabras nuevas" }),
            el("dl", { class: "palabras" }, c.palabras.flatMap(([p, s]) => [el("dt", { text: p }), el("dd", { text: s })])),
            c.relacion ? el("p", { class: "hint", text: "🔗 Para practicarlo en 3DPit: " + c.relacion }) : null),
          el("br"),
          final));
        window.scrollTo(0, 0);
      }

      mostrar(c.inicio);
    }

    if (voz) speechSynthesis.getVoices();
    window.addEventListener("pagehide", callar);
    lista();
  </script>
</body>
</html>
