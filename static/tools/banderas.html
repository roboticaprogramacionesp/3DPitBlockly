<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A por la Bandera</title>
  <link rel="stylesheet" href="tools.css">
  <style>
    .back { font-size: 16px; display: inline-flex; padding: 6px 0; }
    main { max-width: 1000px; margin: 0 auto; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 16px; }
    .tabs button { font-size: 15px; padding: 10px 16px; border-radius: 10px; }
    .tarjeta { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; }
    .tarjeta h2 { margin: 0 0 10px; font-size: 18px; }
    .tarjeta p, .tarjeta li { font-size: 16px; line-height: 1.6; }
    .tarjeta ol, .tarjeta ul { margin: 0; padding-left: 22px; }
    .aviso { border-left: 4px solid #f1c40f; background: #2a2a3f; padding: 10px 14px; border-radius: 8px; margin: 10px 0; font-size: 15px; line-height: 1.5; }
    .pasos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .paso { background: var(--panel-2); border-radius: 10px; padding: 12px; font-size: 15px; line-height: 1.45; }
    .paso b.n { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); margin-right: 6px; }
    .banderas { display: flex; flex-wrap: wrap; gap: 8px; }
    .bandera { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; border: 2px solid transparent; position: relative; }
    .bandera.fuera { opacity: .35; }
    .bandera.propia::after { content: "✏️"; position: absolute; top: 0; right: 0; font-size: 11px; }
    .bandera svg { width: 60px; height: 40px; border-radius: 3px; box-shadow: 0 1px 4px #0006; }
    .tablero { width: 100%; background: #eef0f6; border: 6px solid #a3195b; border-radius: 6px; display: block; }
    .tablero .vaso { cursor: pointer; }
    .mesa { display: grid; grid-template-columns: 1fr 280px; gap: 14px; align-items: start; }
    @media (max-width: 760px) { .mesa { grid-template-columns: 1fr; } }
    .reloj { font-family: monospace; font-size: 42px; font-weight: 800; text-align: center; }
    .carta { min-height: 150px; padding: 8px; border-radius: 12px; display: grid; place-items: center; background: repeating-linear-gradient(45deg, #2c2566, #2c2566 10px, #352d7a 10px, #352d7a 20px); border: 2px solid var(--accent-2); font-size: 15px; color: var(--muted); text-align: center; perspective: 600px; }
    .carta.vista { background: #fff; color: #222; animation: voltear .4s; }
    .carta.reto { background: #fff6d6; color: #222; animation: voltear .4s; }
    .carta.reto .ico { font-size: 40px; }
    .carta svg { width: 150px; height: 100px; }
    @keyframes voltear { from { transform: rotateY(90deg); } to { transform: none; } }
    .mazo { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin: 8px 0; min-height: 34px; }
    .mazo i { width: 20px; height: 30px; border-radius: 3px; background: #352d7a; border: 1px solid var(--accent-2); }
    .mazo.barajando i { animation: barajar .5s ease-in-out 3; }
    .mazo i:nth-child(odd) { animation-direction: reverse; }
    @keyframes barajar { 50% { transform: translateY(-14px) rotate(12deg); } }
    .acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .acciones button { font-size: 15px; padding: 9px 14px; border-radius: 10px; flex: 1 1 auto; }
    button.bien { background: #1f6f45; border-color: var(--ok); }
    button.mal { background: #7a2e2e; border-color: #e74c3c; }
    button.movido { background: #6b4e12; border-color: #f39c12; }
    table.res { width: 100%; border-collapse: collapse; font-size: 15px; }
    table.res td, table.res th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    input.texto { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 15px; }
    .editor { display: grid; grid-template-columns: 1fr 200px; gap: 14px; align-items: start; }
    @media (max-width: 700px) { .editor { grid-template-columns: 1fr; } }
    .editor .vista svg { width: 100%; border-radius: 6px; box-shadow: 0 2px 8px #0008; }
    .campos { display: grid; gap: 10px; }
    .campos label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
    .colores { display: flex; gap: 8px; }
    .colores input { width: 54px; height: 36px; padding: 0; border: 0; background: none; }
    .patrones { display: flex; flex-wrap: wrap; gap: 6px; }
    .patrones button { padding: 4px; border-radius: 6px; }
    .patrones svg { width: 42px; height: 28px; display: block; }
    .retos { display: grid; gap: 8px; }
    .reto { display: flex; align-items: center; gap: 10px; background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
    .reto .ico { font-size: 26px; }
    .reto span.txt { flex: 1; line-height: 1.4; }
    .reto input[type=checkbox] { width: 20px; height: 20px; }
    .contador { font-weight: 700; }
    .contador.lleno { color: #ff8a65; }
  </style>
</head>
<body>
<main>
  <a class="back" href="index.html">⬅ Herramientas</a>
  <h1>🚩 A por la Bandera</h1>
  <p class="subtitle">Juego del Desafío de Robótica Educativa: retira los vasos del tablero en el menor tiempo posible.</p>
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
</main>

<script src="tools.js"></script>
<script>
  // ── Banderas del juego (dibujos sencillos en SVG, 30 × 20) ──
  const FLAGS = {
    mx: { n: "México", s: '<rect width="10" height="20" fill="#006847"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce1126"/><circle cx="15" cy="10" r="2.6" fill="#8c5a2b"/>' },
    ca: { n: "Canadá", s: '<rect width="30" height="20" fill="#fff"/><rect width="7.5" height="20" fill="#d52b1e"/><rect x="22.5" width="7.5" height="20" fill="#d52b1e"/><path d="M15 4l1.2 2.4 1.8-.8-.6 3.4 2-1.6.4 1.4 1.6-.2-.8 2 1 .6-3.6 2.6.4 1.4-3-.4V17h-.8v-2.2l-3 .4.4-1.4-3.6-2.6 1-.6-.8-2 1.6.2.4-1.4 2 1.6-.6-3.4 1.8.8z" fill="#d52b1e"/>' },
    br: { n: "Brasil", s: '<rect width="30" height="20" fill="#009c3b"/><path d="M15 2.5L27.5 10 15 17.5 2.5 10z" fill="#ffdf00"/><circle cx="15" cy="10" r="4.4" fill="#002776"/><path d="M10.8 9.2q4.2-1.2 8.4 1.4" stroke="#fff" stroke-width=".7" fill="none"/>' },
    fr: { n: "Francia", s: '<rect width="10" height="20" fill="#0055a4"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ef4135"/>' },
    ar: { n: "Argentina", s: '<rect width="30" height="20" fill="#74acdf"/><rect y="6.67" width="30" height="6.67" fill="#fff"/><circle cx="15" cy="10" r="2" fill="#f6b40e"/>' },
    es: { n: "España", s: '<rect width="30" height="20" fill="#aa151b"/><rect y="5" width="30" height="10" fill="#f1bf00"/><rect x="7" y="7.5" width="3" height="5" rx=".8" fill="#aa151b"/>' },
    de: { n: "Alemania", s: '<rect width="30" height="6.67" fill="#000"/><rect y="6.67" width="30" height="6.67" fill="#dd0000"/><rect y="13.33" width="30" height="6.67" fill="#ffce00"/>' },
    gb: { n: "Reino Unido", s: '<rect width="30" height="20" fill="#012169"/><path d="M0 0L30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0L30 20M30 0L0 20" stroke="#c8102e" stroke-width="1.4"/><path d="M15 0V20M0 10H30" stroke="#fff" stroke-width="6"/><path d="M15 0V20M0 10H30" stroke="#c8102e" stroke-width="3.4"/>' },
    co: { n: "Colombia", s: '<rect width="30" height="10" fill="#fcd116"/><rect y="10" width="30" height="5" fill="#003893"/><rect y="15" width="30" height="5" fill="#ce1126"/>' },
    it: { n: "Italia", s: '<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#ce2b37"/>' },
  };

  // ── Tarjetas blancas ──
  // El juego trae 10 tarjetas y 10 vasos en blanco. Cada bandera nueva usa
  // una tarjeta y un vaso; cada reto también (su vaso lleva el ícono del
  // reto), así que alcanzan para 10 banderas o retos nuevos.
  const TARJETAS_BLANCAS = 10;
  const VASOS_BLANCOS = 10;
  const PATRONES = {
    v3: (c) => `<rect width="10" height="20" fill="${c[0]}"/><rect x="10" width="10" height="20" fill="${c[1]}"/><rect x="20" width="10" height="20" fill="${c[2]}"/>`,
    h3: (c) => `<rect width="30" height="6.67" fill="${c[0]}"/><rect y="6.67" width="30" height="6.67" fill="${c[1]}"/><rect y="13.33" width="30" height="6.67" fill="${c[2]}"/>`,
    h2: (c) => `<rect width="30" height="10" fill="${c[0]}"/><rect y="10" width="30" height="10" fill="${c[1]}"/>`,
    cruz: (c) => `<rect width="30" height="20" fill="${c[0]}"/><rect x="9" width="4" height="20" fill="${c[1]}"/><rect y="8" width="30" height="4" fill="${c[1]}"/>`,
    diag: (c) => `<rect width="30" height="20" fill="${c[0]}"/><path d="M0 20L30 0V20z" fill="${c[1]}"/>`,
    circulo: (c) => `<rect width="30" height="20" fill="${c[0]}"/><circle cx="15" cy="10" r="6" fill="${c[1]}"/>`,
  };
  const PLANTILLAS = [
    { ico: "🔊", t: "Saca el vaso y haz sonar el buzzer." },
    { ico: "👋", t: "Saca el vaso y saluda moviendo el servo." },
    { ico: "💡", t: "Saca el vaso y prende el LED (o el NeoPixel) 2 segundos." },
    { ico: "🔄", t: "Saca el vaso y da una vuelta completa (360°) en tu lugar." },
    { ico: "↩️", t: "Saca el vaso y llévalo hasta el cuadro rojo." },
    { ico: "🐢", t: "Llega al vaso en reversa y sácalo." },
  ];
  const GUARDA_BLANCAS = "3dpit-banderas-blancas";
  let B = { propias: [], retos: [] };
  try {
    const g = JSON.parse(localStorage.getItem(GUARDA_BLANCAS) || "{}") || {};
    B.propias = g.propias || [];
    // (Antes había un «comodín» sin vaso que no es parte del juego: se quita.)
    B.retos = (g.retos || []).filter((r) => r && r.t && !r.comodin);
    // Versión anterior: los retos listos se marcaban como «activos».
    const viejos = { r_buzzer: 0, r_saludo: 1, r_led: 2, r_vuelta: 3, r_regreso: 4, r_reversa: 5 };
    (g.activos || []).forEach((k) => { if (k in viejos) B.retos.push(Object.assign({ id: "x" + k }, PLANTILLAS[viejos[k]])); });
  } catch (_) {}
  const guardarB = () => { try { localStorage.setItem(GUARDA_BLANCAS, JSON.stringify(B)); } catch (_) {} };
  const tarjetasUsadas = () => B.propias.length + B.retos.length;
  const vasosUsados = tarjetasUsadas; // cada tarjeta nueva lleva su vaso

  const sinEtiquetas = (t) => String(t).replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
  function svgPropia(p) {
    let s = PATRONES[p.patron](p.colores);
    if (p.simbolo) s += `<text x="15" y="13.5" font-size="10" text-anchor="middle">${sinEtiquetas(p.simbolo)}</text>`;
    return s;
  }
  const reto = (k) => B.retos.find((r) => r.id === k);
  // Todo lo que puede tener un vaso en el tablero: banderas y retos.
  function vasoInfo(k) {
    if (FLAGS[k]) return { n: FLAGS[k].n, s: FLAGS[k].s };
    const p = B.propias.find((x) => x.id === k);
    if (p) return { n: p.n, s: svgPropia(p), propia: true };
    const r = reto(k);
    if (r) return { n: "Reto " + r.ico, s: `<rect width="30" height="20" fill="#fff6d6"/><text x="15" y="15" font-size="13" text-anchor="middle">${r.ico}</text>`, reto: r };
    return { n: "?", s: "" };
  }
  const conVaso = () => [...Object.keys(FLAGS), ...B.propias.map((p) => p.id), ...B.retos.map((r) => r.id)];
  const svgBandera = (k) => `<svg viewBox="0 0 30 20" aria-label="${sinEtiquetas(vasoInfo(k).n)}">${vasoInfo(k).s}</svg>`;

  function el(tag, attrs, ...hijos) {
    const n = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n[k] = v;
      else if (k === "text") n.textContent = v;
      else n.setAttribute(k, v);
    });
    hijos.flat().forEach((c) => c != null && n.append(c));
    return n;
  }
  function revolver(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const app = document.getElementById("app");

  // ── Pestañas ──
  const TABS = { reglas: "📖 Cómo se juega", barajar: "🃏 Barajar las tarjetas", blancas: "✏️ Tarjetas blancas", mesa: "⏱️ Mesa del juez" };
  let tab = "reglas";
  function pintarTabs() {
    const t = document.getElementById("tabs");
    t.innerHTML = "";
    Object.entries(TABS).forEach(([k, txt]) => t.append(el("button", { class: tab === k ? "active" : "", onclick: () => { tab = k; mostrar(); } }, txt)));
  }
  function mostrar() {
    pintarTabs();
    app.innerHTML = "";
    ({ reglas, barajar, blancas, mesa })[tab]();
  }

  // ── Reglas ──
  function reglas() {
    app.append(
      el("div", { class: "tarjeta" },
        el("h2", { text: "🎯 Objetivo" }),
        el("p", { text: "Con tu robot, retira del tablero los vasos (9, si no se acuerda otra cosa) en el menor tiempo posible, siguiendo el orden que marcan las tarjetas." })),
      el("div", { class: "tarjeta" },
        el("h2", { text: "🧰 Preparación" }),
        el("ul", {},
          el("li", { html: "Se colocan <b>9 vasos</b> sobre el tablero de 240 × 120 cm. El lugar de cada vaso es libre, pero deben quedar <b>repartidos por todo el tablero</b>." }),
          el("li", { html: "Las <b>tarjetas</b> (una por cada vaso que está en el tablero) se barajan y se ponen <b>boca abajo</b>." }),
          el("li", { html: "El robot empieza en el <b>cuadro rojo (Jugador)</b>, al centro de la orilla de arriba del tablero." }),
          el("li", { html: "Un <b>juez</b> se encarga del cronómetro y de revisar cada vaso." }),
          el("li", { html: "Marca con cinta o plumón un <b>círculo</b> donde va cada vaso: así el juez sabe si un vaso se movió y a dónde regresarlo." }))),
      el("div", { class: "tarjeta" },
        el("h2", { text: "🎮 Cómo se juega" }),
        el("div", { class: "pasos" },
          [["Toma la primera tarjeta del mazo.", 1], ["Mira qué bandera o qué reto indica.", 2], ["Maneja el robot hasta ese vaso.", 3], ["Retira el vaso (y cumple el reto, si es una tarjeta de reto).", 4], ["Toma la siguiente tarjeta.", 5], ["Repite hasta retirar todos los vasos.", 6]]
            .map(([t, n]) => el("div", { class: "paso", html: `<b class="n">${n}</b>${t}` })))),
      el("div", { class: "tarjeta" },
        el("h2", { text: "🏁 Fin del juego" }),
        el("ul", {},
          el("li", { text: "El juego termina cuando se retiraron todos los vasos." }),
          el("li", { text: "El juez anota el tiempo total. Gana el equipo con el tiempo más corto." }))),
      el("div", { class: "tarjeta" },
        el("h2", { text: "⚠️ Reglas importantes" }),
        el("ul", {},
          el("li", { text: "El robot siempre inicia en el cuadro rojo." }),
          el("li", { text: "Las tarjetas se resuelven una por una y en orden: no se puede saltar ningún vaso." }),
          el("li", { text: "Los vasos deben estar repartidos por todo el tablero." }),
          el("li", { html: "Si el robot retira un vaso <b>equivocado</b>, el juez regresa ese vaso a su lugar y el robot vuelve al <b>cuadro rojo</b>. El cronómetro sigue corriendo." }),
          el("li", { html: "Si el robot solo <b>mueve</b> un vaso que no le toca (lo saca de su círculo o lo tira), el juez lo regresa a su lugar, el robot sigue desde donde está y se suman <b>5 segundos</b> al tiempo. Si solo lo roza y el vaso sigue dentro de su círculo, no pasa nada." })),
        el("div", { class: "aviso", html: "💡 <b>Sugerencia:</b> evita mover un vaso que no corresponda, porque cada vaso incorrecto que muevas te agrega <b>5 segundos</b> más al tiempo. Maneja con calma cerca de los otros vasos." }),
        el("div", { class: "aviso", html: "💡 En <b>✏️ Tarjetas blancas</b> puedes crear banderas nuevas y tarjetas de reto. En <b>⏱️ Mesa del juez</b> eliges qué vasos van al tablero, la app los acomoda, baraja, lleva el cronómetro y guarda los tiempos." })));
  }

  // ── Cómo barajar ──
  function barajar() {
    app.append(
      el("div", { class: "tarjeta" },
        el("h2", { text: "1️⃣ Primero, separa las tarjetas que no se usan" }),
        el("p", { html: "El mazo debe tener <b>una tarjeta por cada vaso</b> que está en el tablero. Si en el tablero hay 9 vasos, quita las tarjetas de las banderas que no pusiste. Si no, al final saldría una tarjeta de un vaso que no existe." }),
        el("div", { class: "banderas" }, conVaso().map((k) => el("div", { class: "bandera" + (FLAGS[k] ? "" : " propia"), html: svgBandera(k) + `<span>${sinEtiquetas(vasoInfo(k).n)}</span>` }))),
        el("div", { class: "aviso", html: "✏️ Las <b>tarjetas de reto</b> también tienen su vaso. Todas se barajan juntas." })),
      el("div", { class: "tarjeta" },
        el("h2", { text: "2️⃣ Barájalas bien" }),
        el("div", { class: "pasos" },
          el("div", { class: "paso", html: "<b class=\"n\">1</b><b>Lavadito:</b> extiende las tarjetas boca abajo sobre la mesa y revuélvelas con las dos manos durante unos 20 segundos." }),
          el("div", { class: "paso", html: "<b class=\"n\">2</b><b>Junta el mazo</b> sin voltear ninguna tarjeta." }),
          el("div", { class: "paso", html: "<b class=\"n\">3</b><b>Corta el mazo</b> dos veces: toma la mitad de arriba y ponla debajo." }),
          el("div", { class: "paso", html: "<b class=\"n\">4</b>Deja el mazo <b>boca abajo</b> junto al tablero. Nadie lo ve hasta que empieza el juego." })),
        el("div", { class: "aviso", html: "👀 Baraja el <b>juez</b>, no el equipo que va a jugar. Y para cada equipo se vuelve a barajar, para que nadie se aprenda el orden." })),
      el("div", { class: "tarjeta" },
        el("h2", { text: "🤔 ¿Por qué barajar?" }),
        el("p", { text: "Si las tarjetas salieran siempre en el mismo orden, el segundo equipo ya sabría a qué vaso ir y tendría ventaja. Barajar hace que el orden sea al azar y que el juego sea justo para todos. ¡Es lo mismo que hace un programa cuando elige números al azar!" })));
  }

  // ── Tarjetas blancas ──
  function blancas() {
    const lleno = tarjetasUsadas() >= TARJETAS_BLANCAS;
    const sinVasos = vasosUsados() >= VASOS_BLANCOS;
    // Editor de bandera propia
    const nueva = { n: "", patron: "v3", colores: ["#1565c0", "#ffffff", "#e53935"], simbolo: "" };
    const vista = el("div", { class: "vista" });
    const pintarVista = () => (vista.innerHTML = `<svg viewBox="0 0 30 20">${svgPropia(nueva)}</svg>`);
    const nombre = el("input", { class: "texto", placeholder: "Nombre (por ejemplo: Japón, Mi escuela)", maxlength: "20" });
    nombre.oninput = () => (nueva.n = nombre.value.trim());
    const colores = el("div", { class: "colores" }, [0, 1, 2].map((i) => { const c = el("input", { type: "color", value: nueva.colores[i] }); c.oninput = () => { nueva.colores[i] = c.value; pintarVista(); }; return c; }));
    const simbolo = el("input", { class: "texto", placeholder: "Símbolo (opcional): ⭐ 🌸 ☀️", maxlength: "4" });
    simbolo.oninput = () => { nueva.simbolo = simbolo.value.trim(); pintarVista(); };
    const patrones = el("div", { class: "patrones" }, Object.keys(PATRONES).map((p) => el("button", {
      title: p, html: `<svg viewBox="0 0 30 20">${PATRONES[p](["#555", "#ccc", "#888"])}</svg>`,
      onclick: () => { nueva.patron = p; pintarVista(); },
    })));
    pintarVista();
    const puedeAgregar = () => {
      if (lleno) { Tools.toast(`Ya usaste las ${TARJETAS_BLANCAS} tarjetas blancas`); return false; }
      if (sinVasos) { Tools.toast(`Ya usaste los ${VASOS_BLANCOS} vasos blancos`); return false; }
      return true;
    };
    const agregarReto = (plantilla) => {
      if (!puedeAgregar()) return;
      B.retos.push(Object.assign({ id: "x" + Date.now() + Math.floor(Math.random() * 1000) }, plantilla));
      guardarB(); mostrar();
    };
    const textoReto = el("input", { class: "texto", placeholder: "Escribe un reto, por ejemplo: «Saca el vaso y toca la campana»", maxlength: "90" });

    app.append(
      el("div", { class: "tarjeta" },
        el("h2", { text: "✏️ ¿Para qué sirven las tarjetas blancas?" }),
        el("p", { html: `El juego trae <b>${TARJETAS_BLANCAS} tarjetas</b> y <b>${VASOS_BLANCOS} vasos</b> en blanco. Úsalos para hacer el juego más variado:` }),
        el("ul", {},
          el("li", { html: "<b>🏳️ Banderas nuevas:</b> una tarjeta y un vaso con la bandera. Pueden ser de otros países o inventadas, ¡como la bandera de tu escuela!" }),
          el("li", { html: "<b>⚡ Tarjetas de reto:</b> una tarjeta y un vaso con el ícono del reto. Cuando sale la tarjeta, el robot va a ese vaso, lo saca <b>y además</b> cumple el reto (sonar el buzzer, saludar con el servo…). Para programarlo, mira los retos del tutorial <b>A por la Bandera</b>." })),
        el("p", { class: "hint", text: "Cada tarjeta nueva lleva su vaso, así que alcanzan para 10 banderas o retos nuevos." }),
        el("p", { class: "contador" + (lleno || sinVasos ? " lleno" : ""), text: `Usadas: ${tarjetasUsadas()} de ${TARJETAS_BLANCAS} tarjetas · ${vasosUsados()} de ${VASOS_BLANCOS} vasos` })),
      el("div", { class: "tarjeta" },
        el("h2", { text: "🏳️ Crea una bandera" }),
        el("div", { class: "editor" },
          el("div", { class: "campos" },
            el("label", {}, "Nombre", nombre),
            el("label", {}, "Diseño", patrones),
            el("label", {}, "Colores", colores),
            el("label", {}, "Símbolo", simbolo),
            el("div", { class: "acciones" }, el("button", {
              class: "primary",
              onclick: () => {
                if (!nueva.n) return Tools.toast("Escribe el nombre de la bandera");
                if (!puedeAgregar()) return;
                B.propias.push(Object.assign({ id: "p" + Date.now() }, nueva, { colores: nueva.colores.slice() }));
                guardarB(); mostrar();
              },
            }, "➕ Agregar bandera"))),
          vista),
        B.propias.length ? el("div", { class: "banderas", style: "margin-top:12px" }, B.propias.map((p) => el("div", {
          class: "bandera propia", title: "Toca para borrarla", html: svgBandera(p.id) + `<span>${sinEtiquetas(p.n)}</span>`,
          onclick: () => { if (confirm(`¿Borrar la bandera «${p.n}»?`)) { B.propias = B.propias.filter((x) => x !== p); guardarB(); mostrar(); } },
        }))) : null),
      el("div", { class: "tarjeta" },
        el("h2", { text: "⚡ Tarjetas de reto" }),
        el("p", { class: "hint", text: "Toca ➕ para convertir una tarjeta blanca en ese reto. Te recomendamos 2 o 3 para no alargar demasiado el juego." }),
        el("div", { class: "retos" }, PLANTILLAS.map((r) => el("div", { class: "reto" },
          el("span", { class: "ico", text: r.ico }), el("span", { class: "txt", text: r.t }),
          el("button", { onclick: () => agregarReto(r) }, "➕")))),
        el("div", { class: "acciones" }, textoReto, el("button", {
          onclick: () => {
            const t = textoReto.value.trim();
            if (!t) return Tools.toast("Escribe el reto");
            agregarReto({ ico: "✏️", t });
          },
        }, "➕ Agregar reto propio")),
        B.retos.length ? [
          el("p", { class: "section-title", style: "margin-top:14px", text: "Tus tarjetas de reto:" }),
          el("div", { class: "retos" }, B.retos.map((r) => el("div", { class: "reto" },
            el("span", { class: "ico", text: r.ico }), el("span", { class: "txt", text: r.t }),
            el("button", { title: "Borrar", onclick: () => { B.retos = B.retos.filter((x) => x !== r); guardarB(); mostrar(); } }, "🗑"))))] : null),
      el("div", { class: "tarjeta" },
        el("h2", { text: "🖨️ Imprimir" }),
        el("p", { text: "Imprime tus banderas y tus tarjetas de reto al tamaño real (8.7 × 5.6 cm), y las etiquetas para los vasos, para recortarlas y pegarlas en las tarjetas y vasos blancos." }),
        el("div", { class: "acciones" }, el("button", { class: "primary", onclick: imprimir }, "🖨️ Hoja para imprimir"))));
  }

  function imprimir() {
    const tarjetas = [
      ...B.propias.map((p) => `<div class="t"><svg viewBox="0 0 30 20">${svgPropia(p)}</svg><b>${sinEtiquetas(p.n)}</b></div>`),
      ...B.retos.map((r) => `<div class="t r"><span>${r.ico}</span><p>${sinEtiquetas(r.t)}</p></div>`),
    ];
    const etiquetas = [
      ...B.propias.map((p) => `<div class="s"><svg viewBox="0 0 30 20" preserveAspectRatio="none">${svgPropia(p)}</svg></div>`),
      ...B.retos.map((r) => `<div class="s r"><span>${r.ico}</span></div>`),
    ];
    if (!tarjetas.length) return Tools.toast("Primero crea una bandera o un reto");
    const w = window.open("", "_blank");
    if (!w) return Tools.toast("El navegador bloqueó la ventana para imprimir");
    w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Tarjetas A por la Bandera</title><style>
      body{font-family:system-ui,sans-serif;margin:1cm} h2{font-size:14pt}
      .g{display:flex;flex-wrap:wrap;gap:4mm}
      .t{width:8.7cm;height:5.6cm;border:1px dashed #999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2mm;box-sizing:border-box;padding:3mm;text-align:center}
      .t svg{width:5cm;height:3.33cm} .t b{font-size:13pt} .t.r span{font-size:26pt} .t.r p{margin:0;font-size:11pt}
      .s{width:8.7cm;height:5.6cm;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);border:1px dashed #999;display:grid;place-items:center;background:#fff6d6}
      .s svg{width:100%;height:100%;display:block} .s.r span{font-size:48pt}
      @media print{button{display:none}}
    </style></head><body>
      <button onclick="print()">🖨️ Imprimir</button>
      <h2>Tarjetas (8.7 × 5.6 cm)</h2><div class="g">${tarjetas.join("")}</div>
      ${etiquetas.length ? `<h2>Etiquetas para los vasos</h2><div class="g">${etiquetas.join("")}</div>` : ""}
    </body></html>`);
    w.document.close();
  }

  // ── Mesa del juez ──
  const RESULTADOS = "3dpit-banderas-tiempos";
  let resultados = [];
  try { resultados = JSON.parse(localStorage.getItem(RESULTADOS) || "[]") || []; } catch (_) {}
  const guardarRes = () => { try { localStorage.setItem(RESULTADOS, JSON.stringify(resultados)); } catch (_) {} };

  // Estado de la partida (se conserva al cambiar de pestaña).
  // n: cuántos vasos van al tablero (9 por defecto).
  const J = { n: 9, enJuego: Object.keys(FLAGS).filter((k) => k !== "it"), vasos: null, mazo: [], i: -1, retirados: new Set(), inicio: 0, fin: 0, timer: null, equipo: "", errores: 0, movidos: 0, objetivo: null };
  // Mover (sin sacar) un vaso que no corresponde suma 5 segundos al tiempo.
  const CASTIGO_MOVIDO = 5000;
  const tiempoJ = (hasta) => hasta - J.inicio + J.movidos * CASTIGO_MOVIDO;

  // Los vasos se reparten en una cuadrícula de zonas (3 filas), uno por zona.
  function acomodarVasos() {
    J.enJuego = J.enJuego.filter((k) => conVaso().includes(k));
    if (J.enJuego.length !== J.n) { J.vasos = null; return; }
    const cols = Math.max(3, Math.ceil(J.n / 3)), anchoZ = 240 / cols;
    const zonas = revolver(Array.from({ length: cols * 3 }, (_, i) => i)).slice(0, J.n);
    J.vasos = revolver(J.enJuego).map((k, z) => {
      const zc = zonas[z] % cols, zr = Math.floor(zonas[z] / cols);
      let x, y, intentos = 0;
      do {
        x = zc * anchoZ + 10 + Math.random() * Math.max(1, anchoZ - 20);
        y = zr * 40 + 10 + Math.random() * 20;
      } while (x > 100 && x < 140 && y < 34 && ++intentos < 50); // lejos del cuadro rojo
      return { k, x, y };
    });
    J.retirados = new Set();
  }

  function dibujarTablero() {
    let s = `<svg class="tablero" viewBox="0 0 240 120">`;
    for (let x = 0; x <= 240; x += 24) s += `<line x1="${x}" y1="0" x2="${x}" y2="120" stroke="#d6dae6" stroke-width=".4"/>`;
    for (let y = 0; y <= 120; y += 24) s += `<line x1="0" y1="${y}" x2="240" y2="${y}" stroke="#d6dae6" stroke-width=".4"/>`;
    s += `<line x1="120" y1="0" x2="120" y2="120" stroke="#9aa" stroke-dasharray="2 2" stroke-width=".5"/><line x1="0" y1="60" x2="240" y2="60" stroke="#9aa" stroke-dasharray="2 2" stroke-width=".5"/>`;
    s += `<rect x="108" y="0" width="24" height="24" fill="#e02020"/><text x="120" y="14" font-size="4.5" fill="#fff" text-anchor="middle" font-weight="700">JUGADOR</text>`;
    if (!J.vasos) return s + `<text x="120" y="70" font-size="7" text-anchor="middle" fill="#a3195b">Elige exactamente ${J.n} vasos</text></svg>`;
    const actual = J.i >= 0 && J.i < J.mazo.length ? J.mazo[J.i] : null;
    for (const v of J.vasos) {
      const fuera = J.retirados.has(v.k), info = vasoInfo(v.k);
      const marca = v.k === actual && !fuera;
      s += `<g class="vaso" data-k="${v.k}" opacity="${fuera ? 0.2 : 1}" transform="translate(${v.x},${v.y})">`;
      // Vaso de unos 10 cm de diámetro, a escala del tablero.
      s += `<circle r="5.5" fill="${info.reto ? "#fff6d6" : "#fff"}" stroke="${marca ? "#f1c40f" : "#555"}" stroke-width="${marca ? 1.6 : 0.5}"/>`;
      s += info.reto ? `<text y="2.4" font-size="6.5" text-anchor="middle">${info.reto.ico}</text>`
        : `<svg x="-4.2" y="-2.8" width="8.4" height="5.6" viewBox="0 0 30 20">${info.s}</svg>`;
      s += `<text y="10" font-size="3.4" text-anchor="middle" fill="#333">${sinEtiquetas(info.reto ? "Reto" : info.n)}</text></g>`;
    }
    return s + "</svg>";
  }

  const fmt = (ms) => { const t = Math.max(0, ms) / 1000; return `${String(Math.floor(t / 60)).padStart(2, "0")}:${(t % 60).toFixed(1).padStart(4, "0")}`; };

  // Pasa a la siguiente tarjeta; termina cuando ya no quedan vasos.
  function siguienteTarjeta() {
    J.i++;
    if (J.i >= J.mazo.length || J.vasos.every((v) => J.retirados.has(v.k))) {
      J.i = J.mazo.length;
      J.fin = Date.now();
      resultados.push({ equipo: J.equipo || "Equipo " + (resultados.length + 1), ms: tiempoJ(J.fin), errores: J.errores, movidos: J.movidos, vasos: J.n, fecha: new Date().toLocaleDateString("es-MX") });
      guardarRes();
    }
    mostrar();
  }

  function mesa() {
    if (!J.vasos) acomodarVasos();
    const reloj = el("div", { class: "reloj", text: fmt(J.inicio ? tiempoJ(J.fin || Date.now()) : 0) });
    clearInterval(J.timer);
    if (J.inicio && !J.fin) J.timer = setInterval(() => { reloj.textContent = fmt(tiempoJ(Date.now())); }, 100);

    const actual = J.i >= 0 && J.i < J.mazo.length ? J.mazo[J.i] : null;
    const rActual = actual && reto(actual);
    const carta = el("div", { class: "carta" + (rActual ? " reto" : actual ? " vista" : "") });
    if (rActual) carta.innerHTML = `<div><div class="ico">${rActual.ico}</div><div style="font-size:18px">Ve al vaso <b>del reto ${rActual.ico}</b></div><b>${sinEtiquetas(rActual.t)}</b></div>`;
    else if (actual) carta.innerHTML = svgBandera(actual) + `<b style="font-size:20px">${sinEtiquetas(vasoInfo(actual).n)}</b>`;
    else carta.textContent = J.inicio && J.fin ? "🏁 ¡Terminó!" : J.mazo.length ? "Mazo listo, boca abajo" : "Baraja las tarjetas para empezar";
    const mazo = el("div", { class: "mazo" }, Array.from({ length: Math.max(0, J.mazo.length - J.i - 1) }, () => el("i")));
    const jugando = J.inicio && !J.fin;

    const nombre = el("input", { class: "texto", placeholder: "Nombre del equipo", value: J.equipo });
    nombre.oninput = () => (J.equipo = nombre.value);

    const tableroDiv = el("div", { html: dibujarTablero() });
    const reiniciarPartida = () => { J.vasos = null; acomodarVasos(); J.mazo = []; J.i = -1; J.inicio = J.fin = 0; };

    const botones = [];
    if (!jugando) botones.push(el("button", {
      class: "primary",
      onclick: () => {
        if (!J.vasos) return Tools.toast(`Elige exactamente ${J.n} vasos`);
        if (!J.mazo.length || J.fin) { J.mazo = revolver(J.enJuego); J.retirados = new Set(); }
        J.i = 0; J.errores = 0; J.movidos = 0; J.fin = 0; J.inicio = Date.now(); mostrar();
      },
    }, "▶ Empezar y sacar tarjeta"));
    if (jugando) {
      botones.push(el("button", { class: "bien", onclick: () => { J.retirados.add(actual); siguienteTarjeta(); } }, rActual ? "✅ Vaso y reto cumplidos" : "✅ Vaso correcto"));
      botones.push(el("button", { class: "mal", onclick: () => { J.errores++; Tools.toast("❌ Regresa el vaso a su lugar y el robot al cuadro rojo"); mostrar(); } }, "❌ Vaso equivocado"));
      botones.push(el("button", { class: "movido", title: "El robot sacó de su círculo o tiró un vaso que no le tocaba", onclick: () => { J.movidos++; Tools.toast("⚠️ +5 s: regresa el vaso a su círculo; el robot sigue desde donde está"); mostrar(); } }, "⚠️ Vaso movido (+5 s)"));
    }
    if (jugando) botones.push(el("button", { onclick: () => { clearInterval(J.timer); J.inicio = J.fin = 0; J.i = -1; J.retirados = new Set(); mostrar(); } }, "⏹ Cancelar"));

    const elegir = (k) => {
      if (jugando) return;
      if (J.enJuego.includes(k)) J.enJuego = J.enJuego.filter((x) => x !== k);
      else if (J.enJuego.length >= J.n) return Tools.toast(`Ya hay ${J.n}: saca otro vaso primero, o usa ➕ Más vasos`);
      else J.enJuego = [...J.enJuego, k];
      reiniciarPartida(); mostrar();
    };
    const cambiarN = (d) => {
      if (jugando) return;
      const max = conVaso().length;
      J.n = Math.max(3, Math.min(max, J.n + d));
      // Ajusta la selección al nuevo número: agrega o quita los últimos.
      const sobran = conVaso().filter((k) => !J.enJuego.includes(k));
      while (J.enJuego.length < J.n && sobran.length) J.enJuego.push(sobran.shift());
      J.enJuego = J.enJuego.slice(0, J.n);
      reiniciarPartida(); mostrar();
    };

    app.append(el("div", { class: "mesa" },
      el("div", {},
        el("div", { class: "tarjeta" },
          el("h2", { text: "1️⃣ Elige los vasos" }),
          el("div", { class: "acciones", style: "align-items:center;margin-top:0" },
            el("button", { onclick: () => cambiarN(-1) }, "➖ Menos vasos"),
            el("b", { style: "font-size:18px;flex:0 0 auto", text: `${J.n} vasos` }),
            el("button", { onclick: () => cambiarN(1) }, "➕ Más vasos")),
          el("p", { class: "hint", text: `Toca una bandera o un reto para meterlo o sacarlo del tablero. Van ${J.enJuego.length} de ${J.n}.` }),
          el("div", { class: "banderas" }, conVaso().map((k) => el("div", {
            class: "bandera" + (J.enJuego.includes(k) ? "" : " fuera") + (FLAGS[k] ? "" : " propia"),
            html: svgBandera(k) + `<span>${sinEtiquetas(vasoInfo(k).n)}</span>`,
            onclick: () => elegir(k),
          }))),
          B.retos.length || B.propias.length ? null : el("p", { class: "hint", text: "✏️ Crea retos o banderas nuevas en la pestaña Tarjetas blancas y aparecerán aquí." })),
        el("div", { class: "tarjeta" },
          el("h2", { text: "2️⃣ Acomoda los vasos así" }),
          tableroDiv,
          el("p", { class: "hint", text: "Las líneas grises son cuadros de 24 cm. Los vasos quedan repartidos por zonas del tablero." }),
          el("div", { class: "acciones" },
            el("button", { onclick: () => { if (jugando) return; acomodarVasos(); mostrar(); } }, "🔀 Otra acomodada al azar")))),
      el("div", {},
        el("div", { class: "tarjeta" },
          el("h2", { text: "3️⃣ Tarjetas" }),
          carta, mazo,
          el("div", { class: "acciones" },
            el("button", {
              onclick: () => {
                if (jugando) return;
                if (!J.vasos) return Tools.toast(`Elige exactamente ${J.n} vasos`);
                J.mazo = revolver(J.enJuego); J.i = -1; J.inicio = J.fin = 0; J.errores = 0; J.movidos = 0; J.retirados = new Set();
                mostrar();
                app.querySelector(".mazo").classList.add("barajando");
              },
            }, "🃏 Barajar"))),
        el("div", { class: "tarjeta" },
          el("h2", { text: "4️⃣ Cronómetro" }),
          nombre, reloj,
          el("div", { class: "acciones" }, botones),
          J.errores ? el("p", { class: "hint", text: `Vasos equivocados: ${J.errores} (cada uno regresó al robot al cuadro rojo).` }) : null,
          J.movidos ? el("p", { class: "hint", text: `Vasos movidos: ${J.movidos} (+${J.movidos * 5} s, ya sumados al cronómetro).` }) : null),
        el("div", { class: "tarjeta" },
          el("h2", { text: "🏆 Tiempos" }),
          resultados.length
            ? el("table", { class: "res" },
                el("tr", {}, el("th", { text: "#" }), el("th", { text: "Equipo" }), el("th", { text: "Tiempo" }), el("th", { text: "❌" }), el("th", { text: "⚠️" })),
                resultados.slice().sort((a, b) => a.ms - b.ms).map((r, i) =>
                  el("tr", {}, el("td", { text: i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : i + 1 }), el("td", { text: r.equipo + (r.vasos && r.vasos !== 9 ? ` (${r.vasos} vasos)` : "") }), el("td", { text: fmt(r.ms) }), el("td", { text: r.errores }), el("td", { text: r.movidos || 0 }))))
            : el("p", { class: "hint", text: "Aquí aparecerán los tiempos de cada equipo." }),
          resultados.length ? el("p", { class: "hint", text: "❌ vasos equivocados · ⚠️ vasos movidos (el tiempo ya incluye +5 s por cada uno)." }) : null,
          resultados.length ? el("div", { class: "acciones" }, el("button", { onclick: () => { if (confirm("¿Borrar todos los tiempos?")) { resultados = []; guardarRes(); mostrar(); } } }, "🗑 Borrar tiempos")) : null))));
  }

  mostrar();
</script>
</body>
</html>
