<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor OLED</title>
  <link rel="stylesheet" href="tools.css">
</head>
<body>
  <a class="back" href="index.html">← Herramientas</a>
  <h1>🖥 Imagen para OLED</h1>
  <p class="subtitle">Dibuja o carga una foto y conviértela a blanco y negro para la pantalla OLED (también SH1106).</p>

  <div class="layout">
    <div>
      <div class="canvas-wrap"><canvas id="screen"></canvas></div>
      <div class="coords" id="coords">x: – y: –</div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="row">
          <label class="field">Tamaño
            <select id="preset">
              <option value="128x64">128 × 64 (pantalla completa)</option>
              <option value="128x32">128 × 32</option>
              <option value="64x64">64 × 64</option>
              <option value="32x32" selected>32 × 32</option>
              <option value="16x16">16 × 16</option>
              <option value="custom">Otro…</option>
            </select>
          </label>
          <label class="field" data-custom>Ancho <input type="number" id="w" min="1" max="128" value="32"></label>
          <label class="field" data-custom>Alto <input type="number" id="h" min="1" max="64" value="32"></label>
          <label class="field">Nombre
            <input type="text" id="name" size="10" value="oled">
          </label>
        </div>
      </div>

      <div class="panel" id="toolbar"></div>

      <div class="panel" id="imagePanel"></div>

      <div class="panel">
        <div class="row">
          <button class="primary" id="insert" data-embedded-only>Insertar en mis bloques</button>
          <button id="copy">Copiar código</button>
        </div>
        <p class="hint" style="margin-top:8px">Necesitas antes el bloque <b>iniciar OLED</b> con el mismo nombre (en la SH1106 el nombre suele ser <b>oledsh</b>).</p>
      </div>
    </div>
  </div>

  <script src="tools.js"></script>
  <script src="pixel-editor.js"></script>
  <script>
    const presetEl = document.getElementById("preset");
    const wEl = document.getElementById("w");
    const hEl = document.getElementById("h");
    const nameEl = document.getElementById("name");
    const edit = Tools.editPayload();

    const ed = PixelEditor({
      canvas: document.getElementById("screen"),
      toolbar: document.getElementById("toolbar"),
      imagePanel: document.getElementById("imagePanel"),
      coords: document.getElementById("coords"),
      mode: "mono",
      shape: "square",
      onColor: "#7fdbff",
    });

    function build(w, h) {
      ed.resize(Math.max(1, Math.min(128, w | 0)), Math.max(1, Math.min(64, h | 0)));
      wEl.value = ed.w; hEl.value = ed.h;
    }

    // ── Tamaño ──
    function showCustom(on) {
      document.querySelectorAll("[data-custom]").forEach((el) => (el.hidden = !on));
    }
    presetEl.onchange = () => {
      const custom = presetEl.value === "custom";
      showCustom(custom);
      if (custom) return;
      const [w, h] = presetEl.value.split("x").map(Number);
      ed.snapshot();
      build(w, h);
    };
    wEl.onchange = hEl.onchange = () => { ed.snapshot(); build(Number(wEl.value), Number(hEl.value)); };


    // ── Salida: MONO_HLSB (lo que espera OLED.icon) ──
    function name() { return Tools.pyName(nameEl.value, "oled"); }

    document.getElementById("copy").onclick = () =>
      Tools.copy(`${name()}.icon(bytes.fromhex('${Tools.monoHex(ed)}'), 0, 0, ${ed.w}, ${ed.h}, 1)\n`);

    document.getElementById("insert").onclick = () => {
      const fields =
        `<mutation w="${ed.w}" h="${ed.h}" data="${Tools.monoHex(ed)}"></mutation>` +
        `<field name="NAME">${Tools.escapeXml(name())}</field>`;
      if (edit) Tools.insertBlocks(`<xml><block type="oled_image">${fields}</block></xml>`, edit.blockId);
      else Tools.insertBlocks(`<xml><block type="oled_image">${fields}${Tools.xy()}</block></xml>`);
    };

    // ── Arranque ──
    if (edit) {
      nameEl.value = edit.name || "oled";
      const preset = `${edit.w}x${edit.h}`;
      const known = Array.from(presetEl.options).some((o) => o.value === preset);
      presetEl.value = known ? preset : "custom";
      showCustom(!known);
      build(edit.w, edit.h);
      ed.setValues(Tools.monoFromHex(edit.data, ed.w, ed.h));
      document.getElementById("insert").textContent = "Guardar en el bloque";
    } else {
      showCustom(false);
      build(32, 32);
    }
  </script>
</body>
</html>
