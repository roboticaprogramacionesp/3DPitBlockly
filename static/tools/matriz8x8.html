<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor Matriz LED</title>
  <link rel="stylesheet" href="tools.css">
</head>
<body>
  <a class="back" href="index.html">← Herramientas</a>
  <h1>🔴 Matriz LED MAX7219</h1>
  <p class="subtitle">Dibuja en uno o varios módulos de 8×8 encadenados (8×8, 16×8, 24×8 o 32×8).</p>

  <div class="layout">
    <div>
      <div class="canvas-wrap"><canvas id="screen"></canvas></div>
      <div class="coords" id="coords">x: – y: –</div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="row">
          <label class="field">Módulos
            <select id="size">
              <option value="8">1 módulo (8 × 8)</option>
              <option value="16">2 módulos (16 × 8)</option>
              <option value="24">3 módulos (24 × 8)</option>
              <option value="32">4 módulos (32 × 8)</option>
            </select>
          </label>
          <label class="field">Nombre de la matriz
            <input type="text" id="name" value="matrix8x8" size="12">
          </label>
        </div>
      </div>

      <div class="panel" id="toolbar"></div>

      <div class="panel">
        <div class="row">
          <button class="primary" id="insert" data-embedded-only>Insertar en mis bloques</button>
          <button id="copy">Copiar código</button>
        </div>
        <p class="hint" style="margin-top:8px">Inserta el bloque <b>mostrar dibujo</b>. Necesitas antes el bloque <b>iniciar matriz</b> con el mismo nombre y el mismo <b>Ancho</b>.</p>
      </div>
    </div>
  </div>

  <script src="tools.js"></script>
  <script src="pixel-editor.js"></script>
  <script>
    const sizeEl = document.getElementById("size");
    const nameEl = document.getElementById("name");
    const edit = Tools.editPayload();

    const ed = PixelEditor({
      canvas: document.getElementById("screen"),
      toolbar: document.getElementById("toolbar"),
      coords: document.getElementById("coords"),
      mode: "mono",
      shape: "round",
      onColor: "#ff3b30",
    });

    sizeEl.onchange = () => { ed.snapshot(); ed.resize(Number(sizeEl.value), 8); };

    function name() { return Tools.pyName(nameEl.value, "matrix8x8"); }

    // Mismo código que genera el bloque matrix8_image (Max8x8.icon).
    document.getElementById("copy").onclick = () =>
      Tools.copy(`${name()}.icon(bytes.fromhex('${Tools.monoHex(ed)}'), 0, 0, ${ed.w}, ${ed.h}, 1)\n`);

    document.getElementById("insert").onclick = () => {
      const fields =
        `<mutation w="${ed.w}" h="${ed.h}" data="${Tools.monoHex(ed)}"></mutation>` +
        `<field name="NAME">${Tools.escapeXml(name())}</field>`;
      if (edit) Tools.insertBlocks(`<xml><block type="matrix8_image">${fields}</block></xml>`, edit.blockId);
      else Tools.insertBlocks(`<xml><block type="matrix8_image">${fields}${Tools.xy()}</block></xml>`);
    };

    if (edit) {
      nameEl.value = edit.name || "matrix8x8";
      const w = [8, 16, 24, 32].includes(edit.w) ? edit.w : 8;
      sizeEl.value = String(w);
      ed.resize(w, 8);
      ed.setValues(Tools.monoFromHex(edit.data, edit.w, edit.h).slice(0, w * 8));
      document.getElementById("insert").textContent = "Guardar en el bloque";
    } else {
      ed.resize(8, 8);
    }
  </script>
</body>
</html>
