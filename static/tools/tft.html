<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor TFT</title>
  <link rel="stylesheet" href="tools.css">
</head>
<body>
  <a class="back" href="index.html">← Herramientas</a>
  <h1>🖼 Imagen para TFT 240×240</h1>
  <p class="subtitle">Dibuja o carga una foto a colores. Con la escala se ve más grande en la pantalla sin ocupar más memoria.</p>

  <div class="layout">
    <div>
      <div class="canvas-wrap"><canvas id="screen"></canvas></div>
      <div class="coords" id="coords">x: – y: –</div>
    </div>

    <div class="side">
      <div class="panel">
        <div class="row">
          <label class="field">Tamaño
            <select id="preset">
              <option value="16">16 × 16</option>
              <option value="24">24 × 24</option>
              <option value="32" selected>32 × 32</option>
              <option value="48">48 × 48</option>
              <option value="64">64 × 64</option>
              <option value="custom">Otro…</option>
            </select>
          </label>
          <label class="field" data-custom>Ancho <input type="number" id="w" min="1" max="64" value="32"></label>
          <label class="field" data-custom>Alto <input type="number" id="h" min="1" max="64" value="32"></label>
          <label class="field">Escala
            <select id="scale">
              <option value="1">×1</option>
              <option value="2">×2</option>
              <option value="3" selected>×3</option>
              <option value="4">×4</option>
            </select>
          </label>
          <label class="field">Nombre
            <input type="text" id="name" size="8" value="tft">
          </label>
        </div>
        <p class="hint" style="margin-top:8px" id="screenSize"></p>
      </div>

      <div class="panel" id="palette"></div>

      <div class="panel" id="toolbar"></div>

      <div class="panel" id="imagePanel"></div>

      <div class="panel">
        <div class="row">
          <button class="primary" id="insert" data-embedded-only>Insertar en mis bloques</button>
          <button id="copy">Copiar código</button>
        </div>
        <p class="hint" style="margin-top:8px">Necesitas antes el bloque <b>iniciar TFT</b> con el mismo nombre. Hasta 64×64 para que el programa quepa en la memoria del ESP32.</p>
      </div>
    </div>
  </div>

  <script src="tools.js"></script>
  <script src="pixel-editor.js"></script>
  <script>
    const presetEl = document.getElementById("preset");
    const wEl = document.getElementById("w");
    const hEl = document.getElementById("h");
    const scaleEl = document.getElementById("scale");
    const nameEl = document.getElementById("name");
    const edit = Tools.editPayload();
    const color = Tools.palette(document.getElementById("palette"), [["Negro", "#000000"]]);

    const ed = PixelEditor({
      canvas: document.getElementById("screen"),
      toolbar: document.getElementById("toolbar"),
      imagePanel: document.getElementById("imagePanel"),
      coords: document.getElementById("coords"),
      mode: "color",
      shape: "square",
      color,
    });

    function updateHint() {
      const s = Number(scaleEl.value);
      const big = ed.w * s > 240 || ed.h * s > 240;
      document.getElementById("screenSize").textContent =
        `En la pantalla ocupa ${ed.w * s} × ${ed.h * s} de 240 × 240` + (big ? " — ¡no entra completa!" : ".");
    }
    function build(w, h) {
      ed.resize(Math.max(1, Math.min(64, w | 0)), Math.max(1, Math.min(64, h | 0)));
      wEl.value = ed.w; hEl.value = ed.h;
      updateHint();
    }
    function showCustom(on) {
      document.querySelectorAll("[data-custom]").forEach((el) => (el.hidden = !on));
    }
    presetEl.onchange = () => {
      const custom = presetEl.value === "custom";
      showCustom(custom);
      if (custom) return;
      ed.snapshot();
      build(Number(presetEl.value), Number(presetEl.value));
    };
    wEl.onchange = hEl.onchange = () => { ed.snapshot(); build(Number(wEl.value), Number(hEl.value)); };
    scaleEl.onchange = updateHint;

    // RGB565 con el byte alto primero: st7789.blit_buffer() manda los bytes
    // a la pantalla tal cual.
    function to565(hex) {
      const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
      return ((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3);
    }
    function from565(c) {
      const r = ((c >> 11) & 0x1f) * 255 / 31, g = ((c >> 5) & 0x3f) * 255 / 63, b = (c & 0x1f) * 255 / 31;
      return "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
    }
    function dataHex() {
      return ed.values.map((p) => to565(p).toString(16).padStart(4, "0")).join("");
    }
    function name() { return Tools.pyName(nameEl.value, "tft"); }

    document.getElementById("copy").onclick = () => {
      const s = scaleEl.value;
      Tools.copy(s === "1"
        ? `${name()}.blit_buffer(bytes.fromhex('${dataHex()}'), 0, 0, ${ed.w}, ${ed.h})\n`
        : `def tft_blit_scaled(tft, data, x, y, w, h, s):
    row = bytearray(w * s * 2)
    for j in range(h):
        for i in range(w):
            hi = data[(j * w + i) * 2]
            lo = data[(j * w + i) * 2 + 1]
            for k in range(s):
                row[(i * s + k) * 2] = hi
                row[(i * s + k) * 2 + 1] = lo
        tft.blit_buffer(row * s, x, y + j * s, w * s, s)

tft_blit_scaled(${name()}, bytes.fromhex('${dataHex()}'), 0, 0, ${ed.w}, ${ed.h}, ${s})
`);
    };

    document.getElementById("insert").onclick = () => {
      const fields =
        `<mutation w="${ed.w}" h="${ed.h}" data="${dataHex()}"></mutation>` +
        `<field name="NAME">${Tools.escapeXml(name())}</field><field name="SCALE">${scaleEl.value}</field>`;
      if (edit) Tools.insertBlocks(`<xml><block type="tft_image">${fields}</block></xml>`, edit.blockId);
      else Tools.insertBlocks(`<xml><block type="tft_image">${fields}${Tools.xy()}</block></xml>`);
    };

    if (edit) {
      nameEl.value = edit.name || "tft";
      if (edit.scale) scaleEl.value = edit.scale;
      const known = edit.w === edit.h && Array.from(presetEl.options).some((o) => o.value === String(edit.w));
      presetEl.value = known ? String(edit.w) : "custom";
      showCustom(!known);
      build(edit.w, edit.h);
      const values = [];
      for (let i = 0; i < ed.w * ed.h; i++) values.push(from565(parseInt(edit.data.substr(i * 4, 4), 16) || 0));
      ed.setValues(values);
      document.getElementById("insert").textContent = "Guardar en el bloque";
    } else {
      showCustom(false);
      build(32, 32);
    }
  </script>
</body>
</html>
