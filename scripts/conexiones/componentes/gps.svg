<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 71" width="50mm" height="71mm">

    <!-- GPS NEO-6M style: dibujado a mano, mismo criterio que
         bh1750.svg/qmc5883l.svg (no hay asset Fritzing real de este
         módulo en el proyecto todavía). Antena de parche cerámica
         (el cuadrado tostado con grilla) arriba, PCB abajo con el
         chip receptor y los 4 pines VCC/GND/TX/RX en el borde
         inferior. -->

    <rect x="4" y="2" width="42" height="42" rx="2" fill="#c9a876" stroke="#8a6d3b" stroke-width="0.6" />
    <g stroke="#8a6d3b" stroke-width="0.3" opacity="0.6">
        <line x1="4"  y1="12" x2="46" y2="12" />
        <line x1="4"  y1="22" x2="46" y2="22" />
        <line x1="4"  y1="32" x2="46" y2="32" />
        <line x1="14" y1="2"  x2="14" y2="44" />
        <line x1="25" y1="2"  x2="25" y2="44" />
        <line x1="36" y1="2"  x2="36" y2="44" />
    </g>
    <circle cx="25" cy="23" r="2.2" fill="#8a6d3b" opacity="0.8" />

    <rect x="2" y="46" width="46" height="20" rx="2" fill="#0e4d78" />

    <text x="25" y="52" fill="#ffffff" font-size="3.6" font-weight="bold" text-anchor="middle" font-family="sans-serif">GPS NEO-6M</text>

    <rect x="16" y="53.5" width="18" height="8" rx="1.2" fill="#111111" stroke="#333333" stroke-width="0.4" />

    <!-- LED de fix (prende cuando fixValid, ver gps.behavior.js) -->
    <circle data-role="gps-fix-led" cx="41" cy="55" r="1.6" fill="#333333" />

    <g fill="#8c8c8c">
        <circle cx="9"  cy="68" r="1.6" />
        <circle cx="18" cy="68" r="1.6" />
        <circle cx="27" cy="68" r="1.6" />
        <circle cx="36" cy="68" r="1.6" />
    </g>

    <g fill="#ffffff" font-size="2.6" font-family="sans-serif" text-anchor="middle">
        <text x="9"  y="64.5">VCC</text>
        <text x="18" y="64.5">GND</text>
        <text x="27" y="64.5">TX</text>
        <text x="36" y="64.5">RX</text>
    </g>

</svg>
