<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 92">

    <!-- Rosca de la base -->
    <rect x="20" y="55" width="20" height="22" rx="2" fill="#9a9a9a" stroke="#6b6b6b" stroke-width="1"/>
    <line x1="20" y1="60" x2="40" y2="60" stroke="#6b6b6b" stroke-width="1.4"/>
    <line x1="20" y1="65" x2="40" y2="65" stroke="#6b6b6b" stroke-width="1.4"/>
    <line x1="20" y1="70" x2="40" y2="70" stroke="#6b6b6b" stroke-width="1.4"/>
    <rect x="24" y="77" width="12" height="4" fill="#3a3a3a"/>

    <!-- Vidrio (el color/opacidad de esto se togglea al prender/apagar) -->
    <circle data-role="bulb-glass" cx="30" cy="32" r="26" fill="#4a4a4a" stroke="#707070" stroke-width="1.2"/>

    <!-- Filamento (visible siempre, más brillante cuando está prendido) -->
    <path data-role="bulb-filament" d="M 21,42 L 26,18 L 30,38 L 34,14 L 39,42"
          stroke="#2a2a2a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Pines -->
    <circle cx="24" cy="88" r="1"/>
    <circle cx="36" cy="88" r="1"/>

</svg>
