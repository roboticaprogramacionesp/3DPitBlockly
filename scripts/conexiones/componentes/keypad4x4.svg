  <!--
    No es una copia literal del .svg de Fritzing (ese viene con
    varias capas de transform anidadas: matrix/translate/rotate,
    que hacen impracticable taggear cada tecla para hacerla
    clickeable). En cambio, se reconstruyó el layout a partir de las
    coordenadas y colores REALES del original (ver el cálculo hecho
    antes de armar este archivo): mismo esquema de colores (dígitos
    0-9 en azul #2a7fff, A/B/C/D/*/# en rojo #d40000), mismo orden de
    teclas fila por fila, mismas proporciones generales (housing
    negro + borde blanco interior + grid de botones redondeados).

    Cada tecla se identifica con data-keypad-role="r{fila}c{col}"
    (0-indexado, fila y columna), coincidiendo exactamente con como
    keypad4.py arma el índice del keymap:
        key = self._keymap[row_index * self._num_cols + col_index]
    ver Renderer.bindKeypad4x4().

    Coordenadas en las mismas unidades que "width"/"height" del JSON
    (70x96), igual que el resto de los componentes propios.
  -->
