<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100">

  <!--
    Icono plano (no es la vista de Fritzing): mismo criterio que
    tft_st7789.svg. Cuerpo simple + los 3 focos identificados por
    atributo, para que Renderer.applySemaforoState() los prenda/
    apague de forma independiente sin necesitar ningun paso de
    "tageo" por id (a diferencia de Display7, que sí lo necesita
    porque su .svg es un export de Fritzing con ids autogenerados).

    Coordenadas en las mismas unidades que "width"/"height" del JSON
    (40x100), igual que tft_st7789.svg, asi los pines del JSON caen
    exactamente donde corresponde.

    Cada foco arranca con su color "apagado" (oscuro) puesto directo
    como fill; Renderer.applySemaforoState() lo pisa por JS
    (style.fill) segun el estado electrico real, igual que hace
    Display7 con DISPLAY7_ON_COLOR/OFF_COLOR.

    IMPORTANTE: los comentarios XML no pueden tener dos guiones
    seguidos en ningun lugar del texto (solo justo antes del cierre).
  -->

  <!-- Cuerpo del semaforo -->
  <rect x="5" y="3" width="30" height="60" rx="8" fill="#1c1c1c" stroke="#050505" stroke-width="1"/>

  <!-- Los 3 focos: arrancan en su color "apagado" -->
  <circle data-semaforo-role="r" cx="20" cy="15" r="7" fill="#3a0a0a" stroke="#050505" stroke-width="0.6"/>
  <circle data-semaforo-role="y" cx="20" cy="33" r="7" fill="#3a330a" stroke="#050505" stroke-width="0.6"/>
  <circle data-semaforo-role="g" cx="20" cy="51" r="7" fill="#0a3a12" stroke="#050505" stroke-width="0.6"/>

  <!-- Poste que baja hasta el conector -->
  <rect x="17" y="63" width="6" height="8" fill="#1c1c1c"/>

  <!-- Franja del conector, donde van los 4 pines -->
  <rect x="2" y="71" width="36" height="20" rx="3" fill="#0c0c0c" stroke="#050505" stroke-width="1"/>

  <!-- Anillos de pad de cada pin, puramente cosmeticos: el cuadrado
       clickeable real lo dibuja Renderer.renderPins() encima, en las
       mismas coordenadas que vienen del JSON. -->
  <circle cx="9"  cy="81" r="3" fill="none" stroke="#c9a227" stroke-width="0.9"/>
  <circle cx="17" cy="81" r="3" fill="none" stroke="#c9a227" stroke-width="0.9"/>
  <circle cx="25" cy="81" r="3" fill="none" stroke="#c9a227" stroke-width="0.9"/>
  <circle cx="33" cy="81" r="3" fill="none" stroke="#c9a227" stroke-width="0.9"/>

  <!-- Serigrafia -->
  <text x="9"  y="89" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="4">R</text>
  <text x="17" y="89" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="4">Y</text>
  <text x="25" y="89" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="4">G</text>
  <text x="33" y="89" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="3.2">GND</text>

</svg>
