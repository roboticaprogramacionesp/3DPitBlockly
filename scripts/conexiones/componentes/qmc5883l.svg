<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 66" width="52mm" height="66mm">

    <!-- QMC5883L (GY-271 style breakout): dibujado a mano, mismo
         estilo/escala que bh1750.svg (PCB oscuro, chip negro, pines
         GND/VCC/SCL/SDA en el borde inferior). No hay asset Fritzing
         real de este módulo en el proyecto todavía. -->

    <rect x="2" y="2" width="48" height="62" rx="3" fill="#1a1a2e" />

    <circle cx="10" cy="10" r="1.8" fill="#000000" opacity="0.5" />
    <circle cx="42" cy="10" r="1.8" fill="#000000" opacity="0.5" />
    <circle cx="10" cy="56" r="1.8" fill="#000000" opacity="0.5" />
    <circle cx="42" cy="56" r="1.8" fill="#000000" opacity="0.5" />

    <rect x="17" y="26" width="18" height="18" rx="1.5" fill="#0a0a0a" stroke="#333333" stroke-width="0.5" />

    <!-- Rosa de los vientos, la aguja rota con el heading elegido en el panel -->
    <circle cx="26" cy="35" r="7.5" fill="none" stroke="#555555" stroke-width="0.4" />
    <g data-role="qmc-needle">
        <line x1="26" y1="35" x2="26" y2="28.5" stroke="#ff3b30" stroke-width="1.1" stroke-linecap="round" />
        <line x1="26" y1="35" x2="26" y2="41.5" stroke="#c8c8c8" stroke-width="1.1" stroke-linecap="round" />
    </g>
    <circle cx="26" cy="35" r="1" fill="#888888" />

    <text x="26" y="12" fill="#ffffff" font-size="5" font-weight="bold" text-anchor="middle" font-family="sans-serif">QMC5883L</text>

    <g fill="#8c8c8c">
        <circle cx="10" cy="58" r="1.6" />
        <circle cx="19" cy="58" r="1.6" />
        <circle cx="28" cy="58" r="1.6" />
        <circle cx="37" cy="58" r="1.6" />
    </g>

    <g fill="#ffffff" font-size="2.6" font-family="sans-serif" text-anchor="middle">
        <text x="10" y="54.5">GND</text>
        <text x="19" y="54.5">VCC</text>
        <text x="28" y="54.5">SCL</text>
        <text x="37" y="54.5">SDA</text>
    </g>

</svg>
