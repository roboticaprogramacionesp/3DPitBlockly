<?xml version='1.0' encoding='UTF-8' standalone='no'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 70" version="1.1">
    <desc>PitSimulator: KY-022 (receptor infrarrojo), dibujado a mano porque no habia una pieza aislada real para calcar -- ver SignalEngine sobre el protocolo IRRX.</desc>

    <!-- placa -->
    <rect x="2" y="2" width="28" height="50" rx="2.5" fill="#0a73b1" stroke="#063c5c" stroke-width="0.6" />

    <!-- cupula del receptor IR -->
    <ellipse cx="16" cy="16" rx="10" ry="10" fill="#1a1a1a" />
    <ellipse cx="12.5" cy="12" rx="3.2" ry="2.2" fill="#3f3f3f" opacity="0.55" />

    <!-- LED indicador "L" -->
    <rect x="14" y="30" width="4" height="4" rx="0.8" fill="#cc3333" />
    <text x="16" y="38.2" font-family="sans-serif" font-size="3" fill="#dfe8f0" text-anchor="middle">L</text>

    <text x="16" y="44.5" font-family="sans-serif" font-size="4.2" font-weight="700" fill="#ffffff" text-anchor="middle">KY-022</text>

    <!-- patas (3 pines, terminan en la punta, ver hc-06.svg) -->
    <rect x="7.3" y="52" width="1.4" height="16" fill="#9a9a9a" />
    <rect x="15.3" y="52" width="1.4" height="16" fill="#9a9a9a" />
    <rect x="23.3" y="52" width="1.4" height="16" fill="#9a9a9a" />

    <text x="8" y="51" font-family="sans-serif" font-size="3.4" fill="#ffffff" text-anchor="middle">S</text>
    <text x="16" y="51" font-family="sans-serif" font-size="3.4" fill="#ffffff" text-anchor="middle">+</text>
    <text x="24" y="51" font-family="sans-serif" font-size="3.4" fill="#ffffff" text-anchor="middle">-</text>
</svg>
