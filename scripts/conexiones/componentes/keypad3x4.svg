<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 59 89">

  <!--
    Mismo criterio que keypad4x4.svg: reconstruido (no es copia
    literal de un export de Fritzing) para poder taggear cada tecla
    con data-keypad-role="r{fila}c{col}" y hacerla clickeable. Mismo
    esquema de colores (dígitos 0-9 en azul #2a7fff, * y # en rojo
    #d40000, ya que acá no hay columna de letras A/B/C/D), mismo
    housing negro + borde blanco interior + grid de botones
    redondeados.

    12 teclas (4 filas x 3 columnas), orden fila por fila igual a
    como keypad4.py arma el índice del keymap:
        key = self._keymap[row_index * self._num_cols + col_index]
    Reutilizá la MISMA clase Keypad de keypad4.py, solo con
    row_pins=[...4 pines...], column_pins=[...3 pines...],
    num_cols=3 y el keymap de 12 elementos
    ['1','2','3','4','5','6','7','8','9','*','0','#'].

    Coordenadas en las mismas unidades que "width"/"height" del JSON
    (59x89).
  -->

  <!-- Housing plastico negro -->
  <rect x="3" y="3" width="53" height="67" rx="4" fill="#1a1a1a" stroke="#000000" stroke-width="1"/>

  <!-- Borde blanco interior -->
  <rect x="7" y="7" width="45" height="59" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Grid 4x3 de teclas -->
  <rect data-keypad-role="r0c0" x="10" y="10" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="15.5" y="17.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">1</text>
  <rect data-keypad-role="r0c1" x="24" y="10" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="29.5" y="17.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">2</text>
  <rect data-keypad-role="r0c2" x="38" y="10" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="43.5" y="17.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">3</text>

  <rect data-keypad-role="r1c0" x="10" y="24" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="15.5" y="31.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">4</text>
  <rect data-keypad-role="r1c1" x="24" y="24" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="29.5" y="31.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">5</text>
  <rect data-keypad-role="r1c2" x="38" y="24" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="43.5" y="31.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">6</text>

  <rect data-keypad-role="r2c0" x="10" y="38" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="15.5" y="45.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">7</text>
  <rect data-keypad-role="r2c1" x="24" y="38" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="29.5" y="45.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">8</text>
  <rect data-keypad-role="r2c2" x="38" y="38" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="43.5" y="45.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">9</text>

  <rect data-keypad-role="r3c0" x="10" y="52" width="11" height="11" rx="1.6" fill="#d40000" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="15.5" y="59.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">*</text>
  <rect data-keypad-role="r3c1" x="24" y="52" width="11" height="11" rx="1.6" fill="#2a7fff" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="29.5" y="59.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">0</text>
  <rect data-keypad-role="r3c2" x="38" y="52" width="11" height="11" rx="1.6" fill="#d40000" stroke="#f8fffd" stroke-width="0.7"/>
  <text x="43.5" y="59.1" text-anchor="middle" fill="#ffffff" font-family="DroidSans, sans-serif" font-size="5.5" pointer-events="none">#</text>

  <!-- Franja del conector, donde van los 7 pines (R1-R4, C1-C3) -->
  <rect x="3" y="72" width="53" height="14" rx="3" fill="#0c1730"/>

  <!-- Anillos de pad de cada pin, puramente cosmeticos: el cuadrado
       clickeable real lo dibuja Renderer.renderPins() encima, en las
       mismas coordenadas que vienen del JSON. Orden: R1,R2,R3,R4,
       C1,C2,C3 (mismo orden que row_pins/column_pins en
       keypad4.py). -->
  <circle cx="7"    cy="79" r="2.4" fill="none" stroke="#c9a227" stroke-width="0.8"/>
  <circle cx="14.5" cy="79" r="2.4" fill="none" stroke="#c9a227" stroke-width="0.8"/>
  <circle cx="22"   cy="79" r="2.4" fill="none" stroke="#c9a227" stroke-width="0.8"/>
  <circle cx="29.5" cy="79" r="2.4" fill="none" stroke="#c9a227" stroke-width="0.8"/>
  <circle cx="37"   cy="79" r="2.4" fill="none" stroke="#c9a227" stroke-width="0.8"/>
  <circle cx="44.5" cy="79" r="2.4" fill="none" stroke="#c9a227" stroke-width="0.8"/>
  <circle cx="52"   cy="79" r="2.4" fill="none" stroke="#c9a227" stroke-width="0.8"/>

  <!-- Etiquetas de pin, debajo de cada anillo (mismo criterio que
       qmc5883l.svg/gps.svg: texto real horneado en el propio SVG) -->
  <g fill="#ffffff" font-family="DroidSans, sans-serif" font-size="3" text-anchor="middle">
    <text x="7"    y="84.5">R1</text>
    <text x="14.5" y="84.5">R2</text>
    <text x="22"   y="84.5">R3</text>
    <text x="29.5" y="84.5">R4</text>
    <text x="37"   y="84.5">C1</text>
    <text x="44.5" y="84.5">C2</text>
    <text x="52"   y="84.5">C3</text>
  </g>

</svg>
