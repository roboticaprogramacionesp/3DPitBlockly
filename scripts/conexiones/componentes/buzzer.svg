<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 50 70"
   version="1.1"
   id="svg10"
   sodipodi:docname="buzzer.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs10" />
  <sodipodi:namedview
     id="namedview10"
     pagecolor="#505050"
     bordercolor="#eeeeee"
     borderopacity="1"
     inkscape:showpageshadow="0"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#505050"
     inkscape:zoom="3.85"
     inkscape:cx="-15.324675"
     inkscape:cy="21.428571"
     inkscape:window-width="1366"
     inkscape:window-height="697"
     inkscape:window-x="-8"
     inkscape:window-y="-8"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg10" />
  <!--
    Icono plano propio (el .svg de Fritzing real trae varias capas
    de transform anidadas, igual problema que ya tuvimos con el
    teclado matricial : se reconstruyó a mano en vez de pelear con
    esa cadena). Mismo esquema de color/disposición que el módulo
    real (keyes KY-006): placa negra, disco piezo grande, 3 pines
    (S, +, -) en un header abajo.

    Piezas con rol especial (ver Renderer.playBuzzerTone/
    stopBuzzerTone):
      [data-buzzer-role^="wave"]  3 arcos concéntricos que se hacen
                                   visibles (opacity 1) SOLO mientras
                                   está sonando un tono : feedback
                                   visual sincronizado con el audio
                                   real de la Web Audio API, no
                                   decorativo nomás.

    Coordenadas en las mismas unidades que "width"/"height" del JSON
    (50x70).
  -->
  <!-- Placa del modulo -->
  <rect
     x="2"
     y="2"
     width="46"
     height="46"
     rx="3"
     fill="#2d2d2d"
     stroke="#000000"
     stroke-width="1"
     id="rect1" />
  <!-- Agujeros de montaje (decorativos) -->
  <circle
     cx="9"
     cy="9"
     r="3"
     fill="none"
     stroke="#8c8c8c"
     stroke-width="1"
     id="circle1" />
  <circle
     cx="41"
     cy="9"
     r="3"
     fill="none"
     stroke="#8c8c8c"
     stroke-width="1"
     id="circle2" />
  <!-- Disco piezoelectrico -->
  <circle
     cx="25"
     cy="25"
     r="18"
     fill="#151212"
     stroke="#000000"
     stroke-width="1"
     id="circle4" />
  <circle
     cx="25"
     cy="25"
     r="5"
     fill="#6a6a6a"
     id="circle5" />
  <!-- Ondas de sonido : arrancan invisibles, Renderer las prende
       mientras hay un tono sonando. Tienen que ir DESPUÉS del disco
       en el documento: en SVG cada elemento se pinta ENCIMA de los
       anteriores, y wave1/wave2 (radio 9.2/15) caen casi enteros
       DENTRO del radio del disco (18); si el disco se dibuja después,
       lo tapa y solo queda visible wave3 (radio 21.5, el único que
       sobresale); bug real reportado por el usuario ("se ve como
       una sola línea"). -->
  <path
     data-buzzer-role="wave1"
     d="M 32 19 A 9.2 9.2 0 0 1 32 31"
     fill="none"
     stroke="#ffcc33"
     stroke-width="1.4"
     opacity="0"
     stroke-linecap="round"
     id="path2" />
  <path
     data-buzzer-role="wave2"
     d="M 35 15 A 15 15 0 0 1 35 35"
     fill="none"
     stroke="#ffcc33"
     stroke-width="1.4"
     opacity="0"
     stroke-linecap="round"
     id="path3" />
  <path
     data-buzzer-role="wave3"
     d="M 38 10 A 21.5 21.5 0 0 1 38 40"
     fill="none"
     stroke="#ffcc33"
     stroke-width="1.4"
     opacity="0"
     stroke-linecap="round"
     id="path4" />
  <!-- Franja del conector, donde van los 3 pines (S, +, -) -->
  <rect
     x="4"
     y="52"
     width="42"
     height="15"
     rx="3"
     fill="#0c1730"
     id="rect5"
     style="stroke-width:1.0351" />
  <!-- Anillos de pad de cada pin, puramente cosmeticos: el cuadrado
       clickeable real lo dibuja Renderer.renderPins() encima, en las
       mismas coordenadas que vienen del JSON. -->
  <circle
     cx="13"
     cy="59"
     r="2.6"
     fill="none"
     stroke="#c9a227"
     stroke-width="0.8"
     id="circle6" />
  <circle
     cx="25"
     cy="59"
     r="2.6"
     fill="none"
     stroke="#c9a227"
     stroke-width="0.8"
     id="circle7" />
  <circle
     cx="37"
     cy="59"
     r="2.6"
     fill="none"
     stroke="#c9a227"
     stroke-width="0.8"
     id="circle8" />
  <!-- Serigrafia -->
  <text
     x="13"
     y="66.200058"
     text-anchor="middle"
     fill="#ffffff"
     font-family="DroidSans, sans-serif"
     font-size="4.5px"
     id="text8">S</text>
  <text
     x="25"
     y="66.200058"
     text-anchor="middle"
     fill="#ffffff"
     font-family="DroidSans, sans-serif"
     font-size="4.5px"
     id="text9">+</text>
  <text
     x="37"
     y="66.200058"
     text-anchor="middle"
     fill="#ffffff"
     font-family="DroidSans, sans-serif"
     font-size="4.5px"
     id="text10">-</text>
</svg>
