    "keys" de keypad4_i2c.py). La diferencia está SOLO en el
    conector de abajo: en vez de 8 pines digitales (R1-R4/C1-C4),
    acá van 4 pines I2C (SDA, SCL, VCC, GND): el expansor I2C
    (tipo PCF8574) que multiplexa las 8 líneas de la matriz vive
    DENTRO del módulo, no se ve desde afuera.

    Coordenadas en las mismas unidades que "width"/"height" del JSON
    (65x79.4, mismo footprint que la versión ajustada del keypad4x4).
